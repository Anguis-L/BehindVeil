asyncapi: 3.0.0

# =============================================================================
# BehindVeil · 房内实时协议（Socket.IO）契约（AsyncAPI 3.0）
#
# OpenAPI 只能描述请求-响应式 HTTP，房内实时交互用它表达不了，故单独一份。
# 管理面 REST 见同目录 openapi.yaml。
#
# 单一事实来源：
#   - packages/shared/src/protocol.ts            事件白名单 + 双向 Zod Schema（T-M1-04）
#   - packages/server/src/gateway/socket.ts      网关实现（T-M1-03/05/06/07/08、T-M2-05）
#   - 00.development/AI_KP_TDD_技术设计文档_v1.md §4/§5.3/§5.4/§5.5/§8/§9
#
# 状态标注（x-status）：
#   implemented  = 网关已接、有真实行为
#   contract-only = Schema 已定、网关已校验 payload 但**暂不处理**（未到里程碑，不提前实现）
#   planned      = 契约已定，代码未落（M3+ 才轮到）
#
# 最近一次回写：2026-09-25（M1 网关落地、M2 KP 预览落地）
# =============================================================================

info:
  title: BehindVeil 房内实时协议
  version: 0.0.0
  summary: 房间内消息 / 开团 / KP 预览的 Socket.IO 事件契约
  description: |
    Socket 只承载**房内实时交互**；建房、房间列表、邀请码重置、会话切换、历史消息拉拉取
    走 HTTP REST（决议 D-03 / ④），见 `openapi.yaml`。

    ## 不变式

    - **叙事交给 LLM，规则交给代码**：AI 只能通过结构化指令块（```aidle）请求检定，
      掷骰与判定永远在服务端用 CSPRNG 完成，结果带流水号与原始骰值，可复现。
    - 消息不可变（append-only），`seq` 在 Session 内严格单调递增；
      服务端重启后从恢复出的 lastSeq 续，不回退。
    - 落盘先于广播（WAP）：只有 fsync 成功才广播；写盘失败该条不广播并回 `E-SRV-01`。
    - **双向 Zod**：入站事件必须命中 `CLIENT_EVENT_SCHEMAS`，出站同样过 `SERVER_EVENT_SCHEMAS`。
      非白名单事件或非法 payload → **直接断连**，不回业务错误（防伪造事件注入，TDD §8）。

    ## 握手

    连接时只查一件事：`auth.protocol` 必须等于服务端 `PROTOCOL_VERSION`（当前 `0.0.0`），
    否则连接被拒。

    ```js
    io({ auth: { protocol: PROTOCOL_VERSION } })   // packages/web/src/stores/session.ts
    ```

    邀请码是否有效、房间是否满员**不在握手阶段查**，而在 `room:join` 事件里查
    （失败回 `E-ROOM-01`，连接保持可用，可换个邀请码重试）。

    角色（决议 D-02）：建房者即 Host，**v1 不可转让**。加入方只能申请 player / observer；
    要成为 Host 必须在 `room:join` 里出示建房时下发的一次性 `hostToken`。

    ## 限速

    消息发送 10 条 / 30 秒 / 人（滑动窗口，超出回 `E-ROOM-01`「发送太频繁」）。
    `ai:invoke` 每人每轮 1 次（「轮」= 相邻两次 AI 响应之间的窗口，D-07）。

    ## 里程碑现状

    | 事件 | 状态 |
    |---|---|
    | `room:join` / `msg:send` / `session:start` | implemented（M1） |
    | `kp:previewPrompt` → `kp:promptPreview` | implemented（M2） |
    | `error:app` | implemented |
    | `ai:invoke` | implemented（M3） |
    | `dice:roll` | implemented（M4） |
    | `state:update` / `state:snapshot` / `state:broadcast` | implemented（M5） |
    | `kp:metrics` → `kp:metricsResult` | implemented（M6） |
    | `narration:delta` / `narration:done` | implemented（M3） |

servers:
  local:
    host: 127.0.0.1:8787
    protocol: ws
    description: |
      Socket.IO 默认命名空间 "/"。公网部署时反代需放行 WebSocket 升级头。
      （AsyncAPI 无 socket.io 专用 protocol id，此处用 ws 表达升级后的长连接。）

channels:
  roomJoin:
    address: room:join
    title: 加入房间
    description: |
      客户端 → 服务端。携带邀请码与昵称加入（FR-01）。

      - `wantRole` 只能填 player / observer；**Host 只能靠 `hostToken` 取得**（决议 D-02 + ①）。
      - `memberId` 用于断线重连复用身份；但**重连成 Host 必须同时出示 hostToken**，
        否则按 wantRole 降级处理（防冒领）。
      - `lastSeq` 用于断线补发：服务端把 seq > lastSeq 的消息按升序回放到本连接。
      - 加入成功后服务端会追加一条 `system/join` 消息并全房广播（仅当已有活跃会话）。

      失败（邀请码无效 / 房间已满）**不断连**，同时走 ack 与 `error:app` 两条路通知。

      **ack（Socket.IO 回调，非独立事件）**：见 `components.schemas.JoinAck`。
    messages:
      join:
        $ref: '#/components/messages/RoomJoin'
    x-ack:
      $ref: '#/components/schemas/JoinAck'

  sessionStart:
    address: session:start
    title: 开始会话
    description: |
      客户端 → 服务端，Host 专用（FR-10/11）。指定模组与会话设置，创建 Session：

      - 自动结束当前活跃会话（`endedAt` 落今），房间 `activeSessionId` 指向新会话
      - 初始化空状态板（version=0）
      - 追加一条 `system/notice`「会话已开始（模块 id）」并全房广播
      - 规则书由模组决定（KP 卡 `extensions.aidle.rulebook` 优先，回退 manifest.rulebook，
        缺省 coc7）并写入 `Session.rulebook`；**一房一规则书**：本房已有活跃会话且规则书
        不同 → 拒绝开团（活跃会话不变）
      - rulebook=generic 时（v3 FR-40）：KP 卡 `genericRule` 必带且装载编译（骰式可解析 /
        when 文法校验），配置快照写入 `Session.genericRule`——坏配置开团即拒 `E-MOD-01`

      **ack**：成功 `{ ok: true, session }`；非 Host `{ ok: false, code: 'E-ROOM-01', message: '仅 Host 可开团' }`；
      规则书冲突 `{ ok: false, code: 'E-MOD-01' }`。
    messages:
      start:
        $ref: '#/components/messages/SessionStart'
    x-ack:
      $ref: '#/components/schemas/SessionStartAck'

  msgSend:
    address: msg:send
    title: 发送消息
    description: |
      客户端 → 服务端，player+ 权限（FR-02）。`observer` 不能发言（回 `E-ROOM-01`「观察者视角不能发言」）。
      尚未开团同样拒绝（「尚未开团，暂不能发言」）。

      **可见性语义（与 REST 历史不同的地方）**：
      - 不带 `targetId` 且 `visibility=all`（缺省）→ IC 或全房 OOC，走全房广播
      - `visibility=host` → 定向投给 Host + 自己
      - 带 `targetId` → 一律按 whisper 处理（`visibility` 被忽略），投给目标 + Host + 自己
      - 收窄场景**绝不走全房广播**（T-M1-06）

      **AI 触发（D-07）**：玩家 IC 消息自动触发 AI 叙事（AI 忙时排队串行，不并发交错）——M3 落地。
    messages:
      send:
        $ref: '#/components/messages/MsgSend'

  aiInvoke:
    address: ai:invoke
    title: 主动召唤 KP
    description: |
      客户端 → 服务端，player+ 权限（FR-03）。每人每轮 1 次，防刷。

      **当前状态：contract-only** —— payload 会被校验，但网关不处理（属 M3）。
    x-status: contract-only
    x-milestone: M3
    messages:
      invoke:
        $ref: '#/components/messages/AiInvoke'

  diceRoll:
    address: dice:roll
    title: 掷骰
    description: |
      客户端 → 服务端（FR-06 / FR-14）。玩家常用 `.r 1d100` 指令，本质上也是本事件
      （`.rh 1d100` = 暗骰，前端把指令翻译成本事件）。
      权限 player+（observer 不可掷骰）。

      `hidden: true` = 暗骰：结果仅投递 **Host + 掷骰者本人**（D-10 2026-09-25 修订；
      早期口径「仅 Host 可用、仅发 host」已作废）。审计流水照常完整记录——
      隐藏的是广播范围，不是凭据。

      骰式文法（支持判定后缀 `1d100<=60`）：
      ```
      expr    := term (("+"|"-") term)*
      term    := ("*"|"/")? dice | number
      dice    := count? "d" sides modifier?      # sides: 数字 | "F"(命运骰)
      modifier := ("kh"|"kl"|"dh"|"dl") number
      check   := expr ("<=" | ">=" | "=") number
      advdis  := ("adv" | "dis")?   # 骰式末尾；v2 FR-23，展开为 2d20kh1 / 2d20kl1
      ```
      骰式非法 → `E-DICE-01`。

      判定规则随会话规则书（v2）：COC7 走 `<=` 六档判定表；5e 走 `>=` DC 比较，
      并按 `nat20Rule`（会话设置，默认 attack_only）判定 nat20 必中 / nat1 必失——
      判定对象是 d20 **面值**而非加修正后的 total。判定种类（kind）缺省随规则书
      （COC7 = skill，5e = ability）。

      **当前状态：implemented（M4）** —— 解析 → 服务端 CSPRNG 掷骰 → 先落审计流水
      （`data/logs/audit-dice.jsonl`，fsync 后）→ 再广播。骰式非法回 `E-DICE-01`
      并附帮助文本：只回请求者，不广播、不占 seq、不入审计（压根没掷出骰子）。
    x-status: implemented
    x-milestone: M4
    messages:
      roll:
        $ref: '#/components/messages/DiceRoll'

  stateUpdate:
    address: state:update
    title: 更新状态板
    description: |
      客户端 → 服务端，Host / 引擎专用（FR-09，T-M5-06 已实现）。
      乐观锁：服务端比对 `expectedVersion` 与状态板当前 `version`，
      不一致即拒绝写入并返回 `E-ST-01`，同时广播最新版本。
      引擎写路径（如理智扣除）经 `engine-writes` 走同一乐观锁落盘广播，不经本事件。
    x-status: implemented
    x-milestone: M5
    messages:
      update:
        $ref: '#/components/messages/StateUpdate'

  stateSnapshot:
    address: state:snapshot
    title: 生成状态快照
    description: |
      客户端 → 服务端，Host 专用（FR-09，T-M5-07 已实现）。
      触发后追加一条 `state_snapshot` 消息入流，后续轮次常驻注入 prompt（TDD §5.5）；
      每 N=20 条消息服务端追加提醒 notice，由 Host 确认生成。
    x-status: implemented
    x-milestone: M5
    messages:
      snapshot:
        $ref: '#/components/messages/StateSnapshot'

  previewPrompt:
    address: kp:previewPrompt
    title: 请求 prompt 组装预览
    description: |
      客户端 → 服务端，Host 专用（FR-13，T-M2-05，已实现）。

      - 非 Host → `E-ROOM-01`「仅 Host 可预览 prompt」
      - 未开团 → `E-ROOM-01`「尚未开团，暂无 prompt 可预览」
      - 不带 `seq`：预览"下一次请求会怎么组装"；带 `seq`：回放该条消息当时的组装过程
      - trace **定向回请求的那一个 socket**，不广播
    messages:
      preview:
        $ref: '#/components/messages/PreviewPrompt'

  kpMetrics:
    address: kp:metrics
    title: 请求本会话实时指标
    description: |
      客户端 → 服务端，Host 专用（T-M6-03/05，FR-13 / R-01 / R-02）。

      为什么房内还要再开一条：`GET /metrics`（openapi.yaml）走管理面令牌，前端不带
      `X-Admin-Token`，而且它给的是**全局**数、不带会话维度。控制台要的是
      「本会话现在烧了多少钱、指令解析顺不顺」。

      - 非 Host → `E-ROOM-01`「仅 Host 可查看实时指标」
      - 未开团 → `E-ROOM-01`「尚未开团，暂无指标可看」
      - 不带 `sessionId`：取房间当前活跃会话；带了就按该会话口径回，
        但**必须属于本房**——不属于 → `E-ROOM-01`「会话不存在」（房内事件不跨房读指标）
      - 回包**定向**给请求的那个 socket，不广播（其他成员不该看到本团的
        token/成本与暗骰计数）
    x-status: implemented
    x-milestone: M6
    messages:
      request:
        $ref: '#/components/messages/KpMetrics'

  msgBroadcast:
    address: msg:broadcast
    title: 消息广播
    description: |
      服务端 → 客户端。六类消息的统一出口（FR-02/03/06/14）。

      - **hidden 骰子只发给 Host**，其余成员收不到这条
      - 断线补发时同一条消息会**按 seq 升序**逐条重放到单个 socket（不是广播）
      - 落盘先于广播（WAP）：只有 fsync 成功才会看到这条消息
    messages:
      broadcast:
        $ref: '#/components/messages/MsgBroadcast'

  narrationDelta:
    address: narration:delta
    title: AI 叙事流式增量
    description: |
      服务端 → 客户端。拼装中的增量片段，客户端按 `seq` 追加到对应气泡。
      **当前不发射**（AI 叙事属 M3）。
    x-status: planned
    x-milestone: M3
    messages:
      delta:
        $ref: '#/components/messages/NarrationDelta'

  narrationDone:
    address: narration:done
    title: AI 叙事结束
    description: |
      服务端 → 客户端。流结束，该条 `seq` 的 NarrationMsg 转正（`streaming: false`）。
      流中断场景见 `E-LLM-02`：已生成部分保留并标记。**当前不发射**（M3）。
    x-status: planned
    x-milestone: M3
    messages:
      done:
        $ref: '#/components/messages/NarrationDone'

  stateBroadcast:
    address: state:broadcast
    title: 状态板变更广播
    description: |
      服务端 → 客户端。状态板任何变更（Host 写入或引擎扣除 SAN 等）后广播全量状态板，
      冲突（E-ST-01）时亦广播最新版供全员对齐（T-M5-06 已实现）。
    x-status: implemented
    x-milestone: M5
    messages:
      state:
        $ref: '#/components/messages/StateBroadcast'

  roomSync:
    address: room:sync
    title: 房间状态快照推送
    description: |
      服务端 → 客户端（2026-10-07 GUI 真人调试修复）。成员进离 / 开团 / Host 转让等
      房间级变更后向全房推送，客户端整体覆盖成员栏与活跃会话——此前这些变更只以
      system 消息入流，已连接客户端的成员列表与「尚未开团」态永远滞后（后进成员
      不可见、玩家端开团后输入仍禁用）。
    x-status: implemented
    messages:
      sync:
        $ref: '#/components/messages/RoomSync'

  promptPreview:
    address: kp:promptPreview
    title: prompt 组装预览
    description: |
      服务端 → 客户端（仅 Host，FR-13，已实现）。
      PipelineTrace 含各阶段 token 数、世界书命中条目（含匹配关键词）、被裁剪条目、
      最终 messages 全文（TDD §9）。

      预览面板对非 Host 不可见——**kpOnly 条目不得出现在非 Host 可见输出**（TDD §8）。
    messages:
      preview:
        $ref: '#/components/messages/PromptPreview'

  kpMetricsResult:
    address: kp:metricsResult
    title: 本会话实时指标
    description: |
      服务端 → 客户端（仅 Host，T-M6-03/05，FR-13 / R-01 / R-02）。

      会话级口径（与 `GET /metrics` 的全局口径互补）：指令解析成功率取自本会话的
      R-01 窗口累计，骰子含暗骰计数，LLM 段给出调用次数 / 失败 / 输入输出 token /
      延迟分布（最近 200 次调用，最近秩法，无样本全 0）。

      多一项 `cost.estimatedCny`：按 TDD §12 成本模型（输入输出分开计价，常量单价）
      折算的人民币估算，用于 R-02「成本失控」的早期预警——是量级提示，不是账单。
    x-status: implemented
    x-milestone: M6
    messages:
      result:
        $ref: '#/components/messages/KpMetricsResult'

  errorApp:
    address: error:app
    title: 业务错误
    description: |
      服务端 → 客户端。错误码表见 TDD §11 + 2026-09-25 新增两码（与 REST 共用 AppError）。

      注意：**非法 payload 或非白名单事件不会走这里**，而是直接断连（TDD §8）。
      这里只回"合法但业务上做不了"的情况（邀请码错、满员、超速、没权限、写盘失败等）。
    messages:
      error:
        $ref: '#/components/messages/ErrorApp'

operations:
  # ---- 客户端 → 服务端 ----
  roomJoin.send:
    action: send
    channel: { $ref: '#/channels/roomJoin' }
    title: 加入房间
    summary: 邀请码 + 昵称加入；带 hostToken 即成为 Host；可带 lastSeq 补发
    x-status: implemented
    messages:
      - $ref: '#/channels/roomJoin/messages/join'

  sessionStart.send:
    action: send
    channel: { $ref: '#/channels/sessionStart' }
    title: 开始会话
    summary: Host 指定模组与设置；自动结束上一活跃会话
    x-status: implemented
    messages:
      - $ref: '#/channels/sessionStart/messages/start'

  msgSend.send:
    action: send
    channel: { $ref: '#/channels/msgSend' }
    title: 发送 IC / OOC 消息
    summary: 限速 10 条 / 30 秒 / 人；observer 不可发言
    x-status: implemented
    messages:
      - $ref: '#/channels/msgSend/messages/send'

  aiInvoke.send:
    action: send
    channel: { $ref: '#/channels/aiInvoke' }
    title: 主动召唤 KP
    summary: 每人每轮 1 次（D-07）；当前仅校验不处理
    x-status: contract-only
    messages:
      - $ref: '#/channels/aiInvoke/messages/invoke'

  diceRoll.send:
    action: send
    channel: { $ref: '#/channels/diceRoll' }
    title: 请求掷骰
    summary: 服务端 CSPRNG 掷骰并按规则书判定；hidden 仅 Host；当前仅校验不处理
    x-status: contract-only
    messages:
      - $ref: '#/channels/diceRoll/messages/roll'

  stateUpdate.send:
    action: send
    channel: { $ref: '#/channels/stateUpdate' }
    title: 更新状态板
    summary: 乐观锁校验 expectedVersion，冲突回 E-ST-01 并广播最新版（M5 已实现）
    x-status: implemented
    messages:
      - $ref: '#/channels/stateUpdate/messages/update'

  stateSnapshot.send:
    action: send
    channel: { $ref: '#/channels/stateSnapshot' }
    title: 生成状态快照
    summary: 追加 state_snapshot 消息入流，每 N=20 条消息提醒 Host（M5 已实现）
    x-status: implemented
    messages:
      - $ref: '#/channels/stateSnapshot/messages/snapshot'

  previewPrompt.send:
    action: send
    channel: { $ref: '#/channels/previewPrompt' }
    title: 请求 prompt 预览
    summary: Host 可观测（FR-13，M2 已实现）
    x-status: implemented
    messages:
      - $ref: '#/channels/previewPrompt/messages/preview'

  kpMetrics.send:
    action: send
    channel: { $ref: '#/channels/kpMetrics' }
    title: 请求本会话实时指标
    summary: Host 可观测（FR-13 / R-02，M6 已实现）；非 Host 或未开团回 E-ROOM-01
    x-status: implemented
    messages:
      - $ref: '#/channels/kpMetrics/messages/request'

  # ---- 服务端 → 客户端 ----
  msgBroadcast.receive:
    action: receive
    channel: { $ref: '#/channels/msgBroadcast' }
    title: 接收消息广播
    summary: 六类消息统一出口；暗骰仅发 Host；断线补发走同一事件
    x-status: implemented
    messages:
      - $ref: '#/channels/msgBroadcast/messages/broadcast'

  narrationDelta.receive:
    action: receive
    channel: { $ref: '#/channels/narrationDelta' }
    title: 接收叙事增量
    x-status: planned
    messages:
      - $ref: '#/channels/narrationDelta/messages/delta'

  narrationDone.receive:
    action: receive
    channel: { $ref: '#/channels/narrationDone' }
    title: 接收叙事结束信号
    x-status: planned
    messages:
      - $ref: '#/channels/narrationDone/messages/done'

  stateBroadcast.receive:
    action: receive
    channel: { $ref: '#/channels/stateBroadcast' }
    title: 接收状态板广播
    x-status: implemented
    messages:
      - $ref: '#/channels/stateBroadcast/messages/state'

  roomSync.receive:
    action: receive
    channel: { $ref: '#/channels/roomSync' }
    title: 接收房间状态快照
    x-status: implemented
    messages:
      - $ref: '#/channels/roomSync/messages/sync'

  promptPreview.receive:
    action: receive
    channel: { $ref: '#/channels/promptPreview' }
    title: 接收 prompt 预览
    summary: 仅 Host 可见（M2 已实现）
    x-status: implemented
    messages:
      - $ref: '#/channels/promptPreview/messages/preview'

  kpMetricsResult.receive:
    action: receive
    channel: { $ref: '#/channels/kpMetricsResult' }
    title: 接收本会话实时指标
    summary: 仅 Host 可见（M6 已实现）；定向回请求 socket，不广播
    x-status: implemented
    messages:
      - $ref: '#/channels/kpMetricsResult/messages/result'

  errorApp.receive:
    action: receive
    channel: { $ref: '#/channels/errorApp' }
    title: 接收业务错误
    x-status: implemented
    messages:
      - $ref: '#/channels/errorApp/messages/error'

components:
  messages:
    # ---- 客户端 → 服务端 ----

    RoomJoin:
      name: roomJoin
      title: 加入房间请求
      payload:
        type: object
        properties:
          inviteCode:
            type: string
            minLength: 6
            maxLength: 6
            description: 6 位邀请码
            examples: [A7K2Q9]
          name:
            type: string
            minLength: 1
            maxLength: 50
            description: 房内展示昵称
            examples: [爱丽丝]
          wantRole:
            type: string
            enum: [player, observer]
            description: 只能申请 player / observer；Host 靠 hostToken 取得（D-02 + 决议 ①）
            default: player
          hostToken:
            type: string
            description: |
              建房响应里一次性下发的 Host 凭证。匹配即被认定为 Host；
              缺省或错误时按 wantRole 加入。Host 重连同样必须出示。
            examples: [ht_9f2c1a7b3e5d]
          memberId:
            type: string
            description: 断线重连时携带原 memberId 复用身份（缺省则新建成员）
            examples: [m_alice]
          lastSeq:
            type: integer
            minimum: 0
            description: 断线重连：客户端已收到的最大 seq，服务端据此补发缺口
        required: [inviteCode, name]
      examples:
        - name: 玩家加入
          payload:
            inviteCode: A7K2Q9
            name: 爱丽丝
            wantRole: player
        - name: Host 进房（建房者）
          payload:
            inviteCode: A7K2Q9
            name: 主持人
            hostToken: ht_9f2c1a7b3e5d
        - name: 断线重连并补发
          payload:
            inviteCode: A7K2Q9
            name: 爱丽丝
            memberId: m_alice
            lastSeq: 38

    SessionStart:
      name: sessionStart
      title: 开始会话请求
      payload:
        type: object
        properties:
          moduleId:
            type: string
            minLength: 1
            description: 模组 ID（session.moduleRef 直接取此值）
            examples: [mountains-of-madness]
          settings:
            $ref: '#/components/schemas/SessionSettings'
        required: [moduleId, settings]
      examples:
        - name: 常规开局
          payload:
            moduleId: mountains-of-madness
            settings:
              provider: openai-compat
              model: deepseek-chat
              temperature: 0.8
              maxHistoryMessages: 40
              worldBookBudgetTokens: 2000
              scanDepth: 4
              contextWindowTokens: 32768
              outputReserveTokens: 2048

    MsgSend:
      name: msgSend
      title: 发送消息请求
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [ic, ooc]
            description: ic=入戏（主消息流）/ ooc=侧栏
          content:
            type: string
            description: 正文
          visibility:
            type: string
            enum: [all, host]
            description: |
              OOC 可见性：all=全房可见、host=仅 Host。
              **带 targetId 时一律按 whisper 处理，本字段被忽略**（所以枚举里没有 whisper）。
          targetId:
            type: string
            description: 私聊对象 memberId；填了就是 whisper，收件人 = 目标 + Host + 自己
        required: [type, content]
      examples:
        - name: IC 发言（触发 AI）
          payload:
            type: ic
            content: 我翻开书桌的抽屉。
        - name: OOC 对 Host 说
          payload:
            type: ooc
            content: 这人看着不太对劲……
            visibility: host
        - name: OOC 私聊某人
          payload:
            type: ooc
            content: 你先走，我殿后。
            targetId: m_bob

    AiInvoke:
      name: aiInvoke
      title: 主动召唤 KP
      payload:
        type: object
        properties:
          reason:
            type: string
            description: 可选，召唤缘由（会进 prompt 上下文）
            examples: ['请描述我进入帐篷后看到的东西']
      examples:
        - name: 空载荷
          payload: {}
        - name: 带缘由
          payload:
            reason: 请描述我进入帐篷后看到的东西

    DiceRoll:
      name: diceRoll
      title: 掷骰请求
      payload:
        type: object
        properties:
          expr:
            type: string
            description: 骰式表达式，可带判定后缀
            examples: ['1d100', '3d6kh2', '1d100<=60', '2d6+3']
          hidden:
            type: boolean
            description: 暗骰，结果仅 Host 可见；**仅 Host 可用**（D-10，FR-14）
            default: false
          label:
            type: string
            description: 展示用标签
            examples: [翻查书桌·侦查]
        required: [expr]
      examples:
        - name: 明骰带判定
          payload:
            expr: 1d100<=60
            label: 翻查书桌·侦查
        - name: 暗骰（Host）
          payload:
            expr: 1d100
            hidden: true
            label: NPC 的隐藏察觉

    StateUpdate:
      name: stateUpdate
      title: 状态板更新请求
      payload:
        type: object
        properties:
          patch:
            $ref: '#/components/schemas/StatePatch'
          expectedVersion:
            type: integer
            minimum: 0
            description: 乐观锁版本号；与服务端不一致 → E-ST-01
        required: [patch, expectedVersion]
      examples:
        - name: 扣 HP 并加状态
          payload:
            expectedVersion: 12
            patch:
              pcs:
                m_alice:
                  sheet:
                    playerName: 爱丽丝
                    occupation: 考古学家
                    str: 50
                    con: 60
                    siz: 55
                    dex: 70
                    app: 65
                    int: 80
                    pow: 60
                    edu: 85
                    luck: 50
                    hp: 8
                    mp: 12
                    san: 55
                    db: '0'
                    build: '0'
                    skills:
                      侦查: 60
                      图书馆使用: 50
                  conditions: ['重伤']
              facts:
                - 爱丽丝在书房被书架砸伤

    StateSnapshot:
      name: stateSnapshot
      title: 生成状态快照请求
      payload:
        type: object
        properties: {}
        additionalProperties: false
        description: 空对象（协议里定义为 `{}`）
      examples:
        - name: 空载荷
          payload: {}

    PreviewPrompt:
      name: previewPrompt
      title: prompt 预览请求
      payload:
        type: object
        properties:
          seq:
            type: integer
            minimum: 0
            description: 回放某条历史消息当时的组装过程（TC-FR-13-002）；缺省取当前状态
      examples:
        - name: 预览下一次请求
          payload: {}
        - name: 回放第 41 条
          payload:
            seq: 41

    KpMetrics:
      name: kpMetrics
      title: 实时指标请求
      payload:
        type: object
        properties:
          sessionId:
            type: string
            minLength: 1
            description: 指定会话；缺省取房间当前活跃会话
            examples: [s_01J9Z8Y7X6]
      examples:
        - name: 取当前活跃会话
          payload: {}
        - name: 指定会话（复播旧团时看历史团的数据）
          payload:
            sessionId: s_01J9Z8Y7X6

    # ---- 服务端 → 客户端 ----

    MsgBroadcast:
      name: msgBroadcast
      title: 消息广播
      payload:
        type: object
        properties:
          msg:
            $ref: '#/components/schemas/Message'
        required: [msg]
      examples:
        - name: 进房播报
          payload:
            msg:
              seq: 39
              ts: '2026-09-25T10:29:00.000Z'
              sessionId: s_01J9Z8Y7X6
              type: system
              subtype: join
              content: 爱丽丝 加入了房间
        - name: 骰子结果（明骰）
          payload:
            msg:
              seq: 41
              ts: '2026-09-25T10:31:00.000Z'
              sessionId: s_01J9Z8Y7X6
              type: dice
              hidden: false
              roll:
                expr: 1d100<=60
                rolls: [[37]]
                kept: [37]
                total: 37
                check:
                  rulebook: coc7
                  kind: skill
                  target: 60
                  difficulty: normal
                  outcome: success
                  grade: hard
                audit:
                  seq: '000913'
                  ts: '2026-09-25T10:31:00.000Z'
                  rollId: 01J9ZB3Q7R
        - name: 检定回注
          payload:
            msg:
              seq: 43
              ts: '2026-09-25T10:31:05.000Z'
              sessionId: s_01J9Z8Y7X6
              type: system
              subtype: ai_directive_result
              content: '侦查检定：1d100=37 / 60，困难成功。'
        - name: 开团播报
          payload:
            msg:
              seq: 1
              ts: '2026-09-25T10:20:00.000Z'
              sessionId: s_01J9Z8Y7X6
              type: system
              subtype: notice
              content: '会话已开始（mountains-of-madness）'

    NarrationDelta:
      name: narrationDelta
      title: 叙事增量
      payload:
        type: object
        properties:
          seq:
            type: integer
            minimum: 0
          delta:
            type: string
        required: [seq, delta]
      examples:
        - payload:
            seq: 42
            delta: 你翻开书桌抽屉，指尖触到

    NarrationDone:
      name: narrationDone
      title: 叙事结束
      payload:
        type: object
        properties:
          seq:
            type: integer
            minimum: 0
        required: [seq]
      examples:
        - payload:
            seq: 42

    StateBroadcast:
      name: stateBroadcast
      title: 状态板广播
      payload:
        type: object
        properties:
          stateBoard:
            $ref: '#/components/schemas/StateBoard'
        required: [stateBoard]

    RoomSync:
      name: roomSync
      title: 房间状态快照
      payload:
        type: object
        properties:
          members:
            type: array
            description: 全量成员名册（成员栏以此整体覆盖）
            items:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                role: { type: string, enum: [host, player, observer] }
                joinedAt: { type: string, format: date-time }
          activeSessionId:
            type: [string, 'null']
            description: 当前活跃会话 id；null = 未开团（输入与状态板随之失效/生效）
        required: [members, activeSessionId]

    PromptPreview:
      name: promptPreview
      title: prompt 组装预览
      payload:
        type: object
        properties:
          pipeline:
            $ref: '#/components/schemas/PipelineTrace'
        required: [pipeline]
      examples:
        - name: 含世界书命中的管线
          payload:
            pipeline:
              stages:
                - name: S1-skeleton
                  tokenCount: 1024
                  detail: { source: 'kp-card.description + 规则书速查' }
                - name: S2-state
                  tokenCount: 512
                  detail: { pcs: 3, facts: 2 }
                - name: S3-worldbook-scan
                  tokenCount: 860
                  detail:
                    hits:
                      - uid: 12
                        matchedKeys: ['南极']
                      - uid: 30
                        matchedKeys: ['/冰层.*异常/']
                        kpOnly: true
                - name: S4-budget-cut
                  tokenCount: 860
                  detail: { budget: 2000, dropped: [] }
                - name: S5-history-trim
                  tokenCount: 2560
                  detail: { kept: 40, trimmed: 12, synopsisApplied: true }
                - name: S6-assemble
                  tokenCount: 4956
                  detail: { sections: 5 }
                - name: S7-validate
                  tokenCount: 4956
                  detail: { hardLimit: 30720, ok: true }
              messages:
                - role: system
                  content: '你是守秘人（KP）……数值以状态板为准。'
                - role: user
                  content: '我翻开书桌的抽屉。'

    KpMetricsResult:
      name: kpMetricsResult
      title: 本会话实时指标
      payload:
        type: object
        properties:
          sessionId:
            type: string
            examples: [s_01J9Z8Y7X6]
          directives:
            type: object
            description: 指令解析成功率（R-01，分母口径见测试文档 §12.4；无尝试时 rate = 1）
            properties:
              attempts:
                type: integer
              successes:
                type: integer
              rate:
                type: number
                minimum: 0
                maximum: 1
            required: [attempts, successes, rate]
          dice:
            type: object
            properties:
              total:
                type: integer
                description: 本会话掷骰总数（玩家骰 + AI 检定骰）
              hidden:
                type: integer
                description: 其中暗骰次数
            required: [total, hidden]
          llm:
            $ref: '#/components/schemas/LlmMetrics'
          cost:
            type: object
            description: 按 TDD §12 成本模型折算的人民币估算（量级提示，非账单）
            properties:
              estimatedCny:
                type: number
            required: [estimatedCny]
        required: [sessionId, directives, dice, llm, cost]
      examples:
        - name: 跑了 40 轮的一团
          payload:
            sessionId: s_01J9Z8Y7X6
            directives: { attempts: 42, successes: 41, rate: 0.976 }
            dice: { total: 31, hidden: 4 }
            llm:
              calls: 44
              failures: 1
              tokensIn: 264000
              tokensOut: 43000
              latencyMs: { p50: 1180, p95: 3420, max: 9100, avg: 1462.5 }
            cost: { estimatedCny: 0.872 }

    ErrorApp:
      name: errorApp
      title: 业务错误
      payload:
        $ref: '#/components/schemas/AppError'
      examples:
        - name: 邀请码无效
          payload:
            code: E-ROOM-01
            message: 邀请码无效
        - name: 房间已满
          payload:
            code: E-ROOM-01
            message: 房间已满
        - name: 超速
          payload:
            code: E-ROOM-01
            message: 发送太频繁，请稍后再试
        - name: 观察者发言
          payload:
            code: E-ROOM-01
            message: 观察者视角不能发言
        - name: 骰式非法
          payload:
            code: E-DICE-01
            message: 骰式无法解析
        - name: 状态板冲突
          payload:
            code: E-ST-01
            message: 数据已更新，请刷新
        - name: 写盘失败
          payload:
            code: E-SRV-01
            message: 服务器开小差了，请稍后重试

  schemas:
    AppError:
      type: object
      description: 业务错误统一载荷（与 REST 共用，TDD §11 + 新增两码）
      properties:
        code:
          type: string
          enum:
            - E-LLM-01
            - E-LLM-02
            - E-DICE-01
            - E-AI-01
            - E-ST-01
            - E-ROOM-01
            - E-MOD-01
            - E-SRV-01
        message:
          type: string
      required: [code, message]

    LlmMetrics:
      type: object
      description: |
        LLM 调用累计（R-02：token 消耗与延迟的防控依据）。
        延迟分布取最近 200 次调用（最近秩法，不做插值），无样本时四项全 0。
      properties:
        calls:
          type: integer
          description: 成功（含流中断）调用次数
        failures:
          type: integer
          description: 失败次数；同样计入延迟样本（等待真实发生了）
        tokensIn:
          type: integer
        tokensOut:
          type: integer
        latencyMs:
          type: object
          properties:
            p50: { type: number }
            p95: { type: number }
            max: { type: number }
            avg: { type: number }
          required: [p50, p95, max, avg]
      required: [calls, failures, tokensIn, tokensOut, latencyMs]

    MemberRole:
      type: string
      enum: [host, player, observer]

    Member:
      type: object
      description: 房间成员（进房 ack 里带回名册，供前端成员栏渲染）
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        joinedAt: { type: string, format: date-time }
      required: [id, name, role, joinedAt]

    JoinAck:
      type: object
      description: |
        `room:join` 的 ack（Socket.IO 回调返回值，**不是独立事件**）。
        失败时 ok=false 且带 code/message，同时服务端也会 emit 一次 `error:app`。
      properties:
        ok: { type: boolean }
        roomId: { type: string }
        memberId: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        activeSessionId: { type: [string, 'null'] }
        lastSeq:
          type: integer
          minimum: 0
          description: 该会话当前最大 seq（无会话时为 0）
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        code: { type: string, enum: [E-ROOM-01] }
        message: { type: string }
      required: [ok]
      examples:
        - ok: true
          roomId: V1StGXR8_Z5j
          memberId: m_alice
          role: player
          activeSessionId: s_01J9Z8Y7X6
          lastSeq: 39
          members:
            - id: m_host
              name: 主持人
              role: host
              joinedAt: '2026-09-25T10:16:00.000Z'
            - id: m_alice
              name: 爱丽丝
              role: player
              joinedAt: '2026-09-25T10:29:00.000Z'
        - ok: false
          code: E-ROOM-01
          message: 房间已满

    SessionStartAck:
      type: object
      description: '`session:start` 的 ack（Socket.IO 回调返回值，不是独立事件）'
      properties:
        ok: { type: boolean }
        session: { $ref: '#/components/schemas/Session' }
        code: { type: string, enum: [E-ROOM-01, E-MOD-01] }
        message: { type: string }
      required: [ok]
      examples:
        - ok: true
          session:
            id: s_01J9Z8Y7X6
            roomId: V1StGXR8_Z5j
            moduleRef: mountains-of-madness
            startedAt: '2026-09-25T10:20:00.000Z'
            endedAt: null
            stateBoardVersion: 0
            synopsis: ''
            settings:
              provider: openai-compat
              model: deepseek-chat
              temperature: 0.8
              maxHistoryMessages: 40
              worldBookBudgetTokens: 2000
              scanDepth: 4
              contextWindowTokens: 32768
              outputReserveTokens: 2048
        - ok: false
          code: E-ROOM-01
          message: 仅 Host 可开团

    SessionSettings:
      type: object
      description: 会话级 LLM / 管线设置（全字段必填，TDD §3.1）
      properties:
        provider: { type: string, examples: [openai-compat] }
        model: { type: string }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxHistoryMessages: { type: integer, minimum: 1, default: 40 }
        worldBookBudgetTokens: { type: integer, minimum: 0, default: 2000 }
        scanDepth: { type: integer, minimum: 1, default: 4 }
        contextWindowTokens:
          type: integer
          minimum: 1
          description: 模型上下文窗口；S7 硬顶 = 它 − outputReserveTokens
          default: 32768
        outputReserveTokens:
          type: integer
          minimum: 1
          description: 输出预留，参与 S7 硬顶计算
          default: 2048
      required:
        - provider
        - model
        - temperature
        - maxHistoryMessages
        - worldBookBudgetTokens
        - scanDepth
        - contextWindowTokens
        - outputReserveTokens

    Session:
      type: object
      properties:
        id: { type: string }
        roomId: { type: string }
        moduleRef: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'] }
        stateBoardVersion: { type: integer, minimum: 0 }
        settings: { $ref: '#/components/schemas/SessionSettings' }
        synopsis: { type: string, default: '' }
      required: [id, roomId, moduleRef, startedAt, endedAt, stateBoardVersion, settings, synopsis]

    PCSheet:
      description: |
        角色卡判别联合（T-M8-01）：按 `rulebook` 分流 COC7 / D&D 5e 两套字段体系；
        缺 `rulebook` 字段的存量数据按 coc7 解析（零迁移）。
      oneOf:
        - type: object
          description: COC7 调查员卡
          properties:
            rulebook: { type: string, enum: [coc7], default: coc7 }
            playerName: { type: string }
            occupation: { type: string }
            str: { type: number }
            con: { type: number }
            siz: { type: number }
            dex: { type: number }
            app: { type: number }
            int: { type: number }
            pow: { type: number }
            edu: { type: number }
            luck: { type: number }
            hp: { type: number }
            mp: { type: number }
            san: { type: number }
            db: { type: string }
            build: { type: string }
            skills:
              type: object
              additionalProperties: { type: number }
          required:
            - playerName
            - occupation
            - str
            - con
            - siz
            - dex
            - app
            - int
            - pow
            - edu
            - luck
            - hp
            - mp
            - san
            - db
            - build
            - skills
        - type: object
          description: D&D 5e 角色卡（六维为属性值，修正值服务端现算）
          properties:
            rulebook: { type: string, enum: [dnd5e] }
            playerName: { type: string }
            occupation: { type: string }
            abilities:
              type: object
              properties:
                str: { type: number }
                dex: { type: number }
                con: { type: number }
                int: { type: number }
                wis: { type: number }
                cha: { type: number }
              required: [str, dex, con, int, wis, cha]
            proficiencyBonus: { type: number }
            ac: { type: number }
            hp:
              type: object
              properties:
                max: { type: number }
                current: { type: number }
              required: [max, current]
            proficientSkills:
              type: array
              items: { type: string }
            proficientSaves:
              type: array
              items: { type: string, enum: [str, dex, con, int, wis, cha] }
          required:
            - rulebook
            - playerName
            - abilities
            - proficiencyBonus
            - ac
            - hp

    StateBoardPc:
      type: object
      properties:
        sheet: { $ref: '#/components/schemas/PCSheet' }
        conditions:
          type: array
          items: { type: string }
      required: [sheet, conditions]

    StateBoard:
      type: object
      description: PC 数值权威状态（TDD §3.7）
      properties:
        version: { type: integer, minimum: 0 }
        pcs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StateBoardPc'
        scene:
          type: object
          properties:
            name: { type: string }
            time: { type: string }
            publicDesc: { type: string }
          required: [name, time, publicDesc]
        facts:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [version, pcs, scene, facts, updatedAt]

    StatePatch:
      type: object
      description: |
        状态板局部补丁（TDD §5.5，已在 shared/protocol.ts 定稿）。
        仅允许这三个业务字段；`version` 走乐观锁单独传 `expectedVersion`。
        传入 `pcs[key]` 即整体覆盖该 PC 的 sheet + conditions；`facts` 同理整体覆盖。
      properties:
        pcs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StateBoardPc'
        scene:
          type: object
          properties:
            name: { type: string }
            time: { type: string }
            publicDesc: { type: string }
          required: [name, time, publicDesc]
        facts:
          type: array
          items: { type: string }

    RollCheck:
      type: object
      properties:
        rulebook: { type: string, enum: [coc7, dnd5e, generic] }
        kind:
          {
            type: string,
            enum: [skill, sanity, opposed, luck, ability, save, attack, initiative, check],
          }
        target: { type: number }
        difficulty: { type: string, enum: [normal, hard, extreme] }
        outcome: { type: string, enum: [critical, success, fail, fumble] }
        grade:
          type: string
          enum: [normal, hard, extreme]
          description: 成功子等级（COC7 困难/极难成功）；critical/fail/fumble 恒 normal
        op:
          type: string
          enum: ['<=', '>=', '=']
          description: >
            判定运算符（缺省 '<='，M4 落地）。'<=' 走规则书判定表（六档，带 grade）；
            '>=' / '=' 走通用布尔比较，outcome 仅 success/fail 且不带 grade。
        nat20Rule:
          type: string
          enum: [attack_only, all_d20]
          description: 判定时的 nat20 适用面快照（5e；复现凭据，缺省时不带）
        genericGrades:
          type: array
          description: 判定时的 generic 档表快照（v3 FR-40；复现凭据，仅 generic 且配置了 grades 时带）
          items:
            type: object
            properties:
              name: { type: string, enum: [critical, success, fail, fumble] }
              when: { type: string, description: 受限文法（只比 raw/total），如 "total>=10" }
      required: [rulebook, kind, target, difficulty, outcome]

    RollAudit:
      type: object
      description: 审计字段（D-04：由 expr + rolls 重算复现，非重放随机数）
      properties:
        seq: { type: string }
        ts: { type: string, format: date-time }
        rollId: { type: string }
      required: [seq, ts, rollId]

    RollResult:
      type: object
      description: 掷骰结果（服务端 CSPRNG 产出，含原始骰值供审计重算）
      properties:
        expr: { type: string }
        rolls:
          type: array
          items:
            type: array
            items: { type: number }
        kept:
          type: array
          items: { type: number }
        total: { type: number }
        check: { $ref: '#/components/schemas/RollCheck' }
        audit: { $ref: '#/components/schemas/RollAudit' }
      required: [expr, rolls, kept, total, audit]

    BaseMsg:
      type: object
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: string, format: date-time }
        sessionId: { type: string }
      required: [seq, ts, sessionId]

    IcMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: ic }
            senderId: { type: string }
            content: { type: string }
          required: [type, senderId, content]

    OocMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: ooc }
            senderId: { type: string }
            content: { type: string }
            visibility: { type: string, enum: [all, host, whisper] }
            targetId: { type: string }
          required: [type, senderId, content, visibility]

    SystemMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: system }
            subtype: { type: string, enum: [ai_directive_result, join, leave, notice] }
            content: { type: string }
          required: [type, subtype, content]

    DiceMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: dice }
            roll: { $ref: '#/components/schemas/RollResult' }
            hidden:
              type: boolean
              description: >
                暗骰（FR-14）。仅 Host 与掷骰者本人可见（D-10 2026-09-25 修订）。
            senderId:
              type: string
              description: 掷骰者 memberId；缺省表示引擎代掷（AI 检定骰）。
          required: [type, roll, hidden]

    NarrationMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: narration }
            streaming: { type: boolean }
            content: { type: string }
          required: [type, streaming, content]

    SnapshotMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: state_snapshot }
            stateBoard: { $ref: '#/components/schemas/StateBoard' }
          required: [type, stateBoard]

    Message:
      description: 六类消息的判别联合（非法 type 在 Schema 层直接拒绝）
      oneOf:
        - $ref: '#/components/schemas/IcMsg'
        - $ref: '#/components/schemas/OocMsg'
        - $ref: '#/components/schemas/SystemMsg'
        - $ref: '#/components/schemas/DiceMsg'
        - $ref: '#/components/schemas/NarrationMsg'
        - $ref: '#/components/schemas/SnapshotMsg'
      discriminator:
        propertyName: type
        mapping:
          ic: '#/components/schemas/IcMsg'
          ooc: '#/components/schemas/OocMsg'
          system: '#/components/schemas/SystemMsg'
          dice: '#/components/schemas/DiceMsg'
          narration: '#/components/schemas/NarrationMsg'
          state_snapshot: '#/components/schemas/SnapshotMsg'

    StageTrace:
      type: object
      description: 管线单阶段产物（TDD §5.1 / §9 可观测）
      properties:
        name:
          type: string
          enum:
            - S1-skeleton
            - S2-state
            - S3-worldbook-scan
            - S4-budget-cut
            - S5-history-trim
            - S6-assemble
            - S7-validate
        tokenCount:
          type: number
          description: 该阶段主要产物的 token 估算（启发式：CJK≈1字/token，ASCII≈4字符/token，D-06）
        detail:
          description: 阶段详情（黄金用例与 KP 预览共用同一形状，需可 JSON 序列化）
      required: [name, tokenCount, detail]

    LlmMessage:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
      required: [role, content]

    PipelineTrace:
      type: object
      description: |
        管线追踪（FR-13）。全量可 JSON 序列化：
        KP 预览与 tests/golden 黄金用例快照共用同一形状，**管线行为变更必须显式更新黄金用例**。
      properties:
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageTrace'
        messages:
          type: array
          description: S6 最终产物；总 token 数见 S7 detail
          items:
            $ref: '#/components/schemas/LlmMessage'
      required: [stages, messages]
