asyncapi: 3.0.0

# =============================================================================
# BehindVeil · 房内实时协议（Socket.IO）契约（AsyncAPI 3.0）
#
# OpenAPI 只能描述请求-响应式 HTTP，房内实时交互用它表达不了，故单独一份。
# 管理面 REST 见同目录 openapi.yaml。
#
# 生成依据：
#   - 00.development/AI_KP_TDD_技术设计文档_v1.md §4 通信协议 / §5.3 骰子 / §5.4 指令协议
#                                                  / §5.5 状态板 / §8 安全 / §9 可观测
#   - packages/shared/src/*.ts（Message / RollResult / StateBoard 等 Zod Schema）
#
# 全部事件均为 planned（M1 起落地），当前代码库尚无 Socket 网关。
# 落地后事件契约以 packages/shared/src/protocol.ts（T-M1-04）为准，请回写本文件。
# =============================================================================

info:
  title: BehindVeil 房内实时协议
  version: 0.0.0
  summary: 房间内消息 / 掷骰 / AI 叙事 / 状态板的 Socket.IO 事件契约
  description: |
    Socket 只承载**房内实时交互**；建房、房间列表、邀请码重置、卡库、模组管理走 HTTP REST
    （决议 D-03），见 `openapi.yaml`。

    ## 不变式

    - **叙事交给 LLM，规则交给代码**：AI 只能通过结构化指令块（```aidle）请求检定，
      掷骰与判定永远在服务端用 CSPRNG 完成，结果带流水号与原始骰值，可复现。
    - 消息不可变（append-only），`seq` 在 Session 内严格单调递增；
      断线重连由客户端上报 `lastSeq`，服务端补发缺口。
    - 所有 payload 经 Zod 双向校验，非法即断连（防伪造事件注入，TDD §8）。

    ## 握手

    连接时校验三件事，任一不满足即拒绝连接：
    1. 协议版本 `protocol` 与服务端 `PROTOCOL_VERSION` 一致（当前 `0.0.0`）
    2. 邀请码有效且房间未满（否则 `E-ROOM-01`）
    3. 成员数未超过 `memberLimit`

    角色（决议 D-02）：建房者即 Host，**v1 不可转让**；加入方只能申请 player / observer。
    Host 可授予 observer 发言权（player+）。

    ## 限速

    消息发送 10 条 / 30 秒 / 人（TDD §8）；`ai:invoke` 每人每轮 1 次
    （「轮」= 相邻两次 AI 响应之间的窗口，D-07）。

servers:
  local:
    host: 127.0.0.1:8787
    protocol: ws
    description: |
      Socket.IO 默认命名空间 "/"。公网部署时反代需放行 WebSocket 升级头。
      （AsyncAPI 无 socket.io 专用 protocol id，此处用 ws 表达升级后的长连接。）

channels:
  roomJoin:
    address: room:join
    title: 加入房间
    description: |
      客户端 → 服务端。携带邀请码与昵称申请加入（FR-01）。
      `wantRole` 只能填 player / observer——Host 由建房者持有，不可申请（D-02）。
    messages:
      join:
        $ref: '#/components/messages/RoomJoin'

  sessionStart:
    address: session:start
    title: 开始会话
    description: |
      客户端 → 服务端，Host 专用（FR-10/11）。指定模组与会话设置，
      创建 Session 并置为房间 `activeSessionId`。
    messages:
      start:
        $ref: '#/components/messages/SessionStart'

  msgSend:
    address: msg:send
    title: 发送消息
    description: |
      客户端 → 服务端，player+ 权限（FR-02）。
      IC 走主消息流，OOC 走侧栏；`targetId` 仅在 OOC 私聊时有意义。

      **AI 触发（D-07）**：玩家 IC 消息自动触发 AI 叙事（AI 忙时排队串行，不并发交错）。
    messages:
      send:
        $ref: '#/components/messages/MsgSend'

  aiInvoke:
    address: ai:invoke
    title: 主动召唤 KP
    description: |
      客户端 → 服务端，player+ 权限（FR-03）。每人每轮 1 次，防刷。
    messages:
      invoke:
        $ref: '#/components/messages/AiInvoke'

  diceRoll:
    address: dice:roll
    title: 掷骰
    description: |
      客户端 → 服务端（FR-06 / FR-14）。玩家常用 `.r 1d100` 指令，本质上也是本事件。
      `hidden: true` = 暗骰，结果仅广播给 Host，**仅 Host 可用**（D-10）。

      骰式文法（支持判定后缀 `1d100<=60`）：
      ```
      expr    := term (("+"|"-") term)*
      term    := ("*"|"/")? dice | number
      dice    := count? "d" sides modifier?      # sides: 数字 | "F"(命运骰)
      modifier := ("kh"|"kl"|"dh"|"dl") number
      check   := expr ("<=" | ">=" | "=") number
      ```
      骰式非法 → `E-DICE-01`。
    messages:
      roll:
        $ref: '#/components/messages/DiceRoll'

  stateUpdate:
    address: state:update
    title: 更新状态板
    description: |
      客户端 → 服务端，Host / 引擎专用（FR-09）。
      乐观锁：服务端比对 `expectedVersion` 与状态板当前 `version`，
      不一致即拒绝写入并返回 `E-ST-01`，同时广播最新版本。
    messages:
      update:
        $ref: '#/components/messages/StateUpdate'

  stateSnapshot:
    address: state:snapshot
    title: 生成状态快照
    description: |
      客户端 → 服务端，Host 专用（FR-09）。
      触发后追加一条 `state_snapshot` 消息入流，后续轮次常驻注入 prompt（TDD §5.5）。
    messages:
      snapshot:
        $ref: '#/components/messages/StateSnapshot'

  previewPrompt:
    address: kp:previewPrompt
    title: 请求 prompt 组装预览
    description: |
      客户端 → 服务端，Host 专用（FR-13）。
      不带 `seq` 时预览"下一次请求会怎么组装"；带 `seq` 时回放该条消息当时的组装过程。
    messages:
      preview:
        $ref: '#/components/messages/PreviewPrompt'

  msgBroadcast:
    address: msg:broadcast
    title: 消息广播
    description: |
      服务端 → 客户端。六类消息的统一出口（FR-02/03/06/14）。
      **hidden 骰子只发给 Host**，其余成员不收到该条。
    messages:
      broadcast:
        $ref: '#/components/messages/MsgBroadcast'

  narrationDelta:
    address: narration:delta
    title: AI 叙事流式增量
    description: 服务端 → 客户端。拼装中的增量片段，客户端按 `seq` 追加到对应气泡。
    messages:
      delta:
        $ref: '#/components/messages/NarrationDelta'

  narrationDone:
    address: narration:done
    title: AI 叙事结束
    description: |
      服务端 → 客户端。流结束，该条 `seq` 的 NarrationMsg 转正（`streaming: false`）。
      流中断场景见 `E-LLM-02`：已生成部分保留并标记。
    messages:
      done:
        $ref: '#/components/messages/NarrationDone'

  stateBroadcast:
    address: state:broadcast
    title: 状态板变更广播
    description: |
      服务端 → 客户端。状态板任何变更（Host 写入或引擎扣除 SAN 等）后广播全量状态板。
    messages:
      state:
        $ref: '#/components/messages/StateBroadcast'

  promptPreview:
    address: kp:promptPreview
    title: prompt 组装预览
    description: |
      服务端 → 客户端（仅 Host）。PipelineTrace 含各阶段 token 数、世界书命中条目
      （含匹配关键词）、被裁剪条目、最终 messages 全文（TDD §9）。
      预览面板对非 Host 不可见——**kpOnly 条目不得出现在非 Host 可见输出**（TDD §8）。
    messages:
      preview:
        $ref: '#/components/messages/PromptPreview'

  errorApp:
    address: error:app
    title: 业务错误
    description: 服务端 → 客户端。错误码表见 TDD §11（与 REST 错误模型共用 AppError）。
    messages:
      error:
        $ref: '#/components/messages/ErrorApp'

operations:
  # ---- 客户端 → 服务端 ----
  roomJoin.send:
    action: send
    channel: { $ref: '#/channels/roomJoin' }
    title: 加入房间
    summary: 携带邀请码与昵称加入
    messages:
      - $ref: '#/channels/roomJoin/messages/join'

  sessionStart.send:
    action: send
    channel: { $ref: '#/channels/sessionStart' }
    title: 开始会话
    summary: Host 指定模组与设置，开启新会话
    messages:
      - $ref: '#/channels/sessionStart/messages/start'

  msgSend.send:
    action: send
    channel: { $ref: '#/channels/msgSend' }
    title: 发送 IC / OOC 消息
    summary: IC 自动触发 AI 叙事；限速 10 条 / 30 秒 / 人
    messages:
      - $ref: '#/channels/msgSend/messages/send'

  aiInvoke.send:
    action: send
    channel: { $ref: '#/channels/aiInvoke' }
    title: 主动召唤 KP
    summary: 每人每轮 1 次（D-07）
    messages:
      - $ref: '#/channels/aiInvoke/messages/invoke'

  diceRoll.send:
    action: send
    channel: { $ref: '#/channels/diceRoll' }
    title: 请求掷骰
    summary: 服务端 CSPRNG 掷骰并按规则书判定；hidden 仅 Host
    messages:
      - $ref: '#/channels/diceRoll/messages/roll'

  stateUpdate.send:
    action: send
    channel: { $ref: '#/channels/stateUpdate' }
    title: 更新状态板
    summary: 乐观锁校验 expectedVersion，冲突返回 E-ST-01
    messages:
      - $ref: '#/channels/stateUpdate/messages/update'

  stateSnapshot.send:
    action: send
    channel: { $ref: '#/channels/stateSnapshot' }
    title: 生成状态快照
    summary: 追加 state_snapshot 消息，后续常驻注入 prompt
    messages:
      - $ref: '#/channels/stateSnapshot/messages/snapshot'

  previewPrompt.send:
    action: send
    channel: { $ref: '#/channels/previewPrompt' }
    title: 请求 prompt 预览
    summary: Host 可观测（FR-13）
    messages:
      - $ref: '#/channels/previewPrompt/messages/preview'

  # ---- 服务端 → 客户端 ----
  msgBroadcast.receive:
    action: receive
    channel: { $ref: '#/channels/msgBroadcast' }
    title: 接收消息广播
    summary: 六类消息统一出口；暗骰仅发 Host
    messages:
      - $ref: '#/channels/msgBroadcast/messages/broadcast'

  narrationDelta.receive:
    action: receive
    channel: { $ref: '#/channels/narrationDelta' }
    title: 接收叙事增量
    messages:
      - $ref: '#/channels/narrationDelta/messages/delta'

  narrationDone.receive:
    action: receive
    channel: { $ref: '#/channels/narrationDone' }
    title: 接收叙事结束信号
    messages:
      - $ref: '#/channels/narrationDone/messages/done'

  stateBroadcast.receive:
    action: receive
    channel: { $ref: '#/channels/stateBroadcast' }
    title: 接收状态板广播
    messages:
      - $ref: '#/channels/stateBroadcast/messages/state'

  promptPreview.receive:
    action: receive
    channel: { $ref: '#/channels/promptPreview' }
    title: 接收 prompt 预览
    summary: 仅 Host 可见
    messages:
      - $ref: '#/channels/promptPreview/messages/preview'

  errorApp.receive:
    action: receive
    channel: { $ref: '#/channels/errorApp' }
    title: 接收业务错误
    messages:
      - $ref: '#/channels/errorApp/messages/error'

components:
  messages:
    # ---- 客户端 → 服务端 ----

    RoomJoin:
      name: roomJoin
      title: 加入房间请求
      payload:
        type: object
        properties:
          inviteCode:
            type: string
            minLength: 6
            maxLength: 6
            description: 6 位邀请码
            examples: [A7K2Q9]
          name:
            type: string
            description: 昵称（房内展示用）
            examples: [爱丽丝]
          wantRole:
            type: string
            enum: [player, observer]
            description: 只能申请 player / observer；Host 不可申请（D-02）
            default: player
        required: [inviteCode, name]
      examples:
        - name: 玩家加入
          payload:
            inviteCode: A7K2Q9
            name: 爱丽丝
            wantRole: player
        - name: 旁观加入
          payload:
            inviteCode: A7K2Q9
            name: 小明
            wantRole: observer

    SessionStart:
      name: sessionStart
      title: 开始会话请求
      payload:
        type: object
        properties:
          moduleId:
            type: string
            description: 模组 ID（data/modules/<id>）
            examples: [mountains-of-madness]
          settings:
            $ref: '#/components/schemas/SessionSettings'
        required: [moduleId, settings]
      examples:
        - name: 常规开局
          payload:
            moduleId: mountains-of-madness
            settings:
              provider: openai-compat
              model: deepseek-chat
              temperature: 0.8
              maxHistoryMessages: 40
              worldBookBudgetTokens: 2000
              scanDepth: 4

    MsgSend:
      name: msgSend
      title: 发送消息请求
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [ic, ooc]
            description: ic=入戏（主消息流）/ ooc=侧栏
          content:
            type: string
            description: 正文
          targetId:
            type: string
            description: OOC 私聊对象成员 ID
        required: [type, content]
      examples:
        - name: IC 发言（触发 AI）
          payload:
            type: ic
            content: 我翻开书桌的抽屉。
        - name: OOC 私聊
          payload:
            type: ooc
            content: 这人看着不太对劲……
            targetId: m_bob

    AiInvoke:
      name: aiInvoke
      title: 主动召唤 KP
      payload:
        type: object
        properties:
          reason:
            type: string
            description: 可选，召唤缘由（会进 prompt 上下文）
            examples: ['请描述我进入帐篷后看到的东西']
      examples:
        - name: 空载荷
          payload: {}
        - name: 带缘由
          payload:
            reason: 请描述我进入帐篷后看到的东西

    DiceRoll:
      name: diceRoll
      title: 掷骰请求
      payload:
        type: object
        properties:
          expr:
            type: string
            description: 骰式表达式，可带判定后缀
            examples: ['1d100', '3d6kh2', '1d100<=60', '2d6+3']
          hidden:
            type: boolean
            description: 暗骰，结果仅 Host 可见；**仅 Host 可用**（D-10，FR-14）
            default: false
          label:
            type: string
            description: 展示用标签
            examples: [翻查书桌·侦查]
        required: [expr]
      examples:
        - name: 明骰带判定
          payload:
            expr: 1d100<=60
            label: 翻查书桌·侦查
        - name: 暗骰（Host）
          payload:
            expr: 1d100
            hidden: true
            label: NPC 的隐藏察觉

    StateUpdate:
      name: stateUpdate
      title: 状态板更新请求
      payload:
        type: object
        properties:
          patch:
            $ref: '#/components/schemas/StatePatch'
          expectedVersion:
            type: integer
            minimum: 0
            description: 乐观锁版本号；与服务端不一致 → E-ST-01
        required: [patch, expectedVersion]
      examples:
        - name: 扣 HP 并加状态
          payload:
            expectedVersion: 12
            patch:
              pcs:
                m_alice:
                  sheet:
                    playerName: 爱丽丝
                    occupation: 考古学家
                    str: 50
                    con: 60
                    siz: 55
                    dex: 70
                    app: 65
                    int: 80
                    pow: 60
                    edu: 85
                    luck: 50
                    hp: 8
                    mp: 12
                    san: 55
                    db: '0'
                    build: '0'
                    skills:
                      侦查: 60
                      图书馆使用: 50
                  conditions: ['重伤']
              facts:
                - 爱丽丝在书房被书架砸伤

    StateSnapshot:
      name: stateSnapshot
      title: 生成状态快照请求
      payload:
        type: object
        properties: {}
        additionalProperties: false
      examples:
        - name: 空载荷
          payload: {}

    PreviewPrompt:
      name: previewPrompt
      title: prompt 预览请求
      payload:
        type: object
        properties:
          seq:
            type: integer
            minimum: 0
            description: 回放某条消息当时的组装过程；缺省 = 预览下一次请求
        examples:
          - payload: {}
          - payload:
              seq: 41

    # ---- 服务端 → 客户端 ----

    MsgBroadcast:
      name: msgBroadcast
      title: 消息广播
      payload:
        type: object
        properties:
          msg:
            $ref: '#/components/schemas/Message'
        required: [msg]
      examples:
        - name: 骰子结果（明骰）
          payload:
            msg:
              seq: 41
              ts: '2026-09-25T10:31:00.000Z'
              sessionId: s_01J9Z8Y7X6
              type: dice
              hidden: false
              roll:
                expr: 1d100<=60
                rolls: [[37]]
                kept: [37]
                total: 37
                check:
                  rulebook: coc7
                  kind: skill
                  target: 60
                  difficulty: normal
                  outcome: success
                  grade: hard
                audit:
                  seq: '000913'
                  ts: '2026-09-25T10:31:00.000Z'
                  rollId: 01J9ZB3Q7R
        - name: 检定回注
          payload:
            msg:
              seq: 43
              ts: '2026-09-25T10:31:05.000Z'
              sessionId: s_01J9Z8Y7X6
              type: system
              subtype: ai_directive_result
              content: '侦查检定：1d100=37 / 60，困难成功。'

    NarrationDelta:
      name: narrationDelta
      title: 叙事增量
      payload:
        type: object
        properties:
          seq:
            type: integer
            minimum: 0
          delta:
            type: string
        required: [seq, delta]
      examples:
        - payload:
            seq: 42
            delta: 你翻开书桌抽屉，指尖触到

    NarrationDone:
      name: narrationDone
      title: 叙事结束
      payload:
        type: object
        properties:
          seq:
            type: integer
            minimum: 0
        required: [seq]
      examples:
        - payload:
            seq: 42

    StateBroadcast:
      name: stateBroadcast
      title: 状态板广播
      payload:
        type: object
        properties:
          stateBoard:
            $ref: '#/components/schemas/StateBoard'
        required: [stateBoard]

    PromptPreview:
      name: promptPreview
      title: prompt 组装预览
      payload:
        type: object
        properties:
          pipeline:
            $ref: '#/components/schemas/PipelineTrace'
        required: [pipeline]
      examples:
        - name: 含世界书命中的管线
          payload:
            pipeline:
              stages:
                - name: S1-skeleton
                  tokenCount: 1024
                  detail: { source: 'kp-card.description + 规则书速查' }
                - name: S2-state
                  tokenCount: 512
                  detail: { pcs: 3, facts: 2 }
                - name: S3-worldbook-scan
                  tokenCount: 860
                  detail:
                    hits:
                      - uid: 12
                        matchedKeys: ['南极']
                      - uid: 30
                        matchedKeys: ['/冰层.*异常/']
                        kpOnly: true
                - name: S4-budget-cut
                  tokenCount: 860
                  detail: { budget: 2000, dropped: [] }
                - name: S5-history-trim
                  tokenCount: 2560
                  detail: { kept: 40, trimmed: 12, synopsisApplied: true }
                - name: S6-assemble
                  tokenCount: 4956
                  detail: { sections: 5 }
                - name: S7-validate
                  tokenCount: 4956
                  detail: { hardLimit: 32000, ok: true }
              messages:
                - role: system
                  content: '你是守秘人（KP）……数值以状态板为准。'
                - role: user
                  content: '我翻开书桌的抽屉。'

    ErrorApp:
      name: errorApp
      title: 业务错误
      payload:
        $ref: '#/components/schemas/AppError'
      examples:
        - name: 骰式非法
          payload:
            code: E-DICE-01
            message: 骰式无法解析
        - name: 状态板冲突
          payload:
            code: E-ST-01
            message: 数据已更新，请刷新
        - name: 房间满员
          payload:
            code: E-ROOM-01
            message: 邀请码无效或房间已满

  schemas:
    AppError:
      type: object
      description: 业务错误统一载荷（与 REST 共用，TDD §11）
      properties:
        code:
          type: string
          enum: [E-LLM-01, E-LLM-02, E-DICE-01, E-AI-01, E-ST-01, E-ROOM-01]
        message:
          type: string
      required: [code, message]

    SessionSettings:
      type: object
      description: 会话级 LLM / 管线设置（全字段必填，TDD §3.1）
      properties:
        provider:
          type: string
          examples: [openai-compat]
        model:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        maxHistoryMessages:
          type: integer
          minimum: 1
          default: 40
        worldBookBudgetTokens:
          type: integer
          minimum: 0
          default: 2000
        scanDepth:
          type: integer
          minimum: 1
          default: 4
      required: [provider, model, temperature, maxHistoryMessages, worldBookBudgetTokens, scanDepth]

    PCSheet:
      type: object
      description: COC7 调查员速览
      properties:
        playerName: { type: string }
        occupation: { type: string }
        str: { type: number }
        con: { type: number }
        siz: { type: number }
        dex: { type: number }
        app: { type: number }
        int: { type: number }
        pow: { type: number }
        edu: { type: number }
        luck: { type: number }
        hp: { type: number }
        mp: { type: number }
        san: { type: number }
        db: { type: string }
        build: { type: string }
        skills:
          type: object
          additionalProperties: { type: number }
      required:
        [
          playerName,
          occupation,
          str,
          con,
          siz,
          dex,
          app,
          int,
          pow,
          edu,
          luck,
          hp,
          mp,
          san,
          db,
          build,
          skills,
        ]

    StateBoardPc:
      type: object
      properties:
        sheet: { $ref: '#/components/schemas/PCSheet' }
        conditions:
          type: array
          items: { type: string }
      required: [sheet, conditions]

    StateBoard:
      type: object
      description: PC 数值权威状态（TDD §3.7）
      properties:
        version:
          type: integer
          minimum: 0
        pcs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StateBoardPc'
        scene:
          type: object
          properties:
            name: { type: string }
            time: { type: string }
            publicDesc: { type: string }
          required: [name, time, publicDesc]
        facts:
          type: array
          items: { type: string }
        updatedAt:
          type: string
          format: date-time
      required: [version, pcs, scene, facts, updatedAt]

    StatePatch:
      type: object
      description: |
        状态板局部补丁（TDD §5.5）。
        ⚠️ TDD 只给了 `StatePatch` 这个类型名，**未定义字段结构**；
        此处按 StateBoard 的可写子集提案（pcs / scene / facts 均可缺省），待 T-M6 细化。
      properties:
        pcs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StateBoardPc'
          description: key = memberId；传入即整体覆盖该 PC 的 sheet + conditions
        scene:
          type: object
          properties:
            name: { type: string }
            time: { type: string }
            publicDesc: { type: string }
        facts:
          type: array
          items: { type: string }
          description: 传入即整体覆盖已确立事实列表

    RollCheck:
      type: object
      properties:
        rulebook:
          type: string
          enum: [coc7, dnd5e]
        kind:
          type: string
          enum: [skill, sanity, opposed, luck]
        target: { type: number }
        difficulty:
          type: string
          enum: [normal, hard, extreme]
        outcome:
          type: string
          enum: [critical, success, fail, fumble]
        grade:
          type: string
          enum: [normal, hard, extreme]
          description: 成功子等级（COC7 困难/极难成功）；critical/fail/fumble 恒 normal
      required: [rulebook, kind, target, difficulty, outcome]

    RollAudit:
      type: object
      description: 审计字段（D-04：由 expr + rolls 重算复现，非重放随机数）
      properties:
        seq: { type: string }
        ts: { type: string, format: date-time }
        rollId: { type: string }
      required: [seq, ts, rollId]

    RollResult:
      type: object
      description: 掷骰结果（服务端 CSPRNG 产出，含原始骰值供审计重算）
      properties:
        expr: { type: string }
        rolls:
          type: array
          items:
            type: array
            items: { type: number }
        kept:
          type: array
          items: { type: number }
        total: { type: number }
        check: { $ref: '#/components/schemas/RollCheck' }
        audit: { $ref: '#/components/schemas/RollAudit' }
      required: [expr, rolls, kept, total, audit]

    BaseMsg:
      type: object
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: string, format: date-time }
        sessionId: { type: string }
      required: [seq, ts, sessionId]

    IcMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: ic }
            senderId: { type: string }
            content: { type: string }
          required: [type, senderId, content]

    OocMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: ooc }
            senderId: { type: string }
            content: { type: string }
            visibility: { type: string, enum: [all, host, whisper] }
            targetId: { type: string }
          required: [type, senderId, content, visibility]

    SystemMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: system }
            subtype: { type: string, enum: [ai_directive_result, join, leave, notice] }
            content: { type: string }
          required: [type, subtype, content]

    DiceMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: dice }
            roll: { $ref: '#/components/schemas/RollResult' }
            hidden: { type: boolean }
          required: [type, roll, hidden]

    NarrationMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: narration }
            streaming: { type: boolean }
            content: { type: string }
          required: [type, streaming, content]

    SnapshotMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type: { type: string, const: state_snapshot }
            stateBoard: { $ref: '#/components/schemas/StateBoard' }
          required: [type, stateBoard]

    Message:
      description: 六类消息的判别联合（非法 type 在 Schema 层直接拒绝）
      oneOf:
        - $ref: '#/components/schemas/IcMsg'
        - $ref: '#/components/schemas/OocMsg'
        - $ref: '#/components/schemas/SystemMsg'
        - $ref: '#/components/schemas/DiceMsg'
        - $ref: '#/components/schemas/NarrationMsg'
        - $ref: '#/components/schemas/SnapshotMsg'
      discriminator:
        propertyName: type
        mapping:
          ic: '#/components/schemas/IcMsg'
          ooc: '#/components/schemas/OocMsg'
          system: '#/components/schemas/SystemMsg'
          dice: '#/components/schemas/DiceMsg'
          narration: '#/components/schemas/NarrationMsg'
          state_snapshot: '#/components/schemas/SnapshotMsg'

    StageTrace:
      type: object
      description: 管线单阶段产物（TDD §5.1 / §9 可观测）
      properties:
        name:
          type: string
          enum:
            - S1-skeleton
            - S2-state
            - S3-worldbook-scan
            - S4-budget-cut
            - S5-history-trim
            - S6-assemble
            - S7-validate
        tokenCount:
          type: number
          description: 该阶段主要产物的 token 估算（启发式：CJK≈1字/token，ASCII≈4字符/token，D-06）
        detail:
          description: 阶段详情（黄金用例与 KP 预览共用同一形状，需可 JSON 序列化）
      required: [name, tokenCount, detail]

    LlmMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content: { type: string }
      required: [role, content]

    PipelineTrace:
      type: object
      description: |
        管线追踪（FR-13）。全量可 JSON 序列化：
        KP 预览与 tests/golden 黄金用例快照共用同一形状，**管线行为变更必须显式更新黄金用例**。
      properties:
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageTrace'
        messages:
          type: array
          description: S6 最终产物；总 token 数见 S7 detail
          items:
            $ref: '#/components/schemas/LlmMessage'
      required: [stages, messages]
