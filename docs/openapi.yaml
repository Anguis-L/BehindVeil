    post:
      operationId: uploadCard
      tags: [卡库]
      summary: 上传角色卡
      description: |
        走**三步导入流**（检测 → 转换 → 验证，SDD §3.2 M5 行）：

        - 检测：PNG 从 tEXt 块取卡数据（**`ccv3` 优先、社区 v2 的 `chara` 回退**，值为 base64(UTF-8 JSON)）；
          JSON 文件直接按文本解析；两者都不像卡 → 400 + `E-CARD-01`，message 里带 `detect`；
        - 转换：v2 旧卡映射为 v3（description 合并 personality；缺 name → `convert`）；
        - 验证：ccv3 Schema + 必填（失败 → `validate`，message 里带字段路径）。

        实现与提案的两处偏差（2026-09-26 实现时定）：

        1. 请求体是 **`application/json` 的 `{ fileName, contentBase64 }`**，不是 multipart——
           省一个 multipart 依赖，NFR-08 许可证门禁少审一棵依赖树；PNG 与 JSON 同一入口。
        2. 不做 `defaultRulebook`：社区卡常没有 `extensions.aidle`，**不编造规则书**，
           摘要里 `rulebook` 返回 null，由 UI 提示用户补（避免猜错规则书导致判定口径错）。

        文件在 `data/cards/` 下原样保存（PNG/JSON 都不重编码），同名不覆盖（追加 `_2` 序号）。
      x-status: implemented
      x-milestone: M5
      x-source: packages/server/src/gateway/http/cards.ts
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCardRequest'
            examples:
              png:
                summary: 上传 PNG 卡（自动提取 ccv3/chara 块）
                value:
                  fileName: keeper.png
                  contentBase64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8
      responses:
        '201':
          description: 导入成功，返回卡片摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

