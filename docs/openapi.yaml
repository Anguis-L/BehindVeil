# =============================================================================
components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        管理面门禁（决议 ②）。**仅当服务端环境变量 `AIDLE_ADMIN_TOKEN` 已设置时生效**；
        未设置则全部放行（零配置，靠网络边界保护），服务端启动时会打一条告警日志。

        2026-09-25 路由分离：管理端点（建房/列房/改配置/重置邀请码/会话管理/卡库/导出）
        才要这个头；**玩家端点 `GET /rooms/{id}/public` 与 `GET /rooms/{id}/messages` 免令牌**
        （`security: []`），否则网页端（不携带该头）进房即 401。`/healthz` 永不要求。

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: 房间 ID（nanoid(12)）
      schema:
        type: string
      example: V1StGXR8_Z5j

  responses:
    BadRequest:
      description: '请求体非法（Zod 校验失败），message 取首个 issue，格式 `字段路径: 原因`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          examples:
            invalidName:
              value:
                code: E-ROOM-01
                message: 'name: 字数不得少于 1'
    Unauthorized:
      description: 管理面已开启门禁但请求未携带或携带错误的 X-Admin-Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          examples:
            noToken:
              value:
                code: E-ROOM-01
                message: 管理面需要 X-Admin-Token 令牌
    NotFound:
      description: 房间不存在（或 room.json 校验失败）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          examples:
            missing:
              value:
                code: E-ROOM-01
                message: 房间不存在
    Internal:
      description: |
        服务端未捕获异常。HTTP ≥ 500 时 message 固定为「内部错误，详情见服务端日志」，
        原始堆栈经 redact 脱敏后只写服务端日志（NFR-03）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          examples:
            internal:
              value:
                code: INTERNAL
                message: 内部错误，详情见服务端日志

  schemas:
    # ---- 系统 ----

    # ---- 可观测（T-M6-03）----

    GlobalIndexEntry:
      type: object
      description: |
        跨房间索引行（v3 FR-34，`shared/src/search.ts` 契约）。
        消息落盘时同批追加到 `data/index/global.jsonl`，`GET /search` 直接返回它
        （冗余了 content，不回源取详情）。
      required: [roomId, sessionId, seq, type, senderId, ts, content]
      properties:
        roomId:
          type: string
        sessionId:
          type: string
        seq:
          type: integer
          minimum: 0
        type:
          type: string
          enum: [ic, ooc, system, dice, narration, state_snapshot]
        senderId:
          type: string
          description: 系统消息为空串（无发送者）；dice 缺省引擎代掷
        ts:
          type: string
          format: date-time
        hidden:
          type: boolean
          description: 仅 dice 消息可能有——暗骰标记（索引是 Host 视角完整版）
        content:
          type: string
          description: 可检索文本；dice 为「骰式 = 结果」；快照为空串

    Metrics:
      type: object
      description: |
        `GET /metrics` 的全局快照（进程内累计，重启清零；不区分房间）。
        延迟分布只取最近 200 次 LLM 调用，累计计数不受窗口影响。
      properties:
        uptimeSec:
          type: integer
          minimum: 0
          description: 进程已运行秒数（向下取整）
        directives:
          type: object
          description: 指令解析成功率（R-01；分母口径见测试文档 §12.4，无尝试时 rate = 1）
          properties:
            attempts:
              type: integer
            successes:
              type: integer
            rate:
              type: number
              minimum: 0
              maximum: 1
          required: [attempts, successes, rate]
        dice:
          type: object
          properties:
            total:
              type: integer
              description: 掷骰总数（玩家骰 + AI 检定骰）
            hidden:
              type: integer
              description: 其中暗骰次数
          required: [total, hidden]
        llm:
          $ref: '#/components/schemas/LlmMetrics'
      required: [uptimeSec, directives, dice, llm]

    LlmMetrics:
      type: object
      description: LLM 调用累计（R-02：token 消耗与延迟的防控依据）
      properties:
        calls:
          type: integer
          description: 成功（含流中断）调用次数
        failures:
          type: integer
          description: 失败次数（重试耗尽 / provider 报错）；同样计入延迟样本
        tokensIn:
          type: integer
          description: 累计输入 token（provider 未回 usage 时不计）
        tokensOut:
          type: integer
          description: 累计输出 token
        latencyMs:
          type: object
          description: |
            延迟分布（毫秒，最近秩法 / nearest-rank，不做插值——返回值一定是真实观测样本）。
            无样本时四项全 0。
          properties:
            p50:
              type: number
            p95:
              type: number
            max:
              type: number
            avg:
              type: number
          required: [p50, p95, max, avg]
      required: [calls, failures, tokensIn, tokensOut, latencyMs]

    Health:
      type: object
      description: 健康检查响应（packages/server/src/index.ts）
      properties:
        ok:
          type: boolean
          const: true
        name:
          type: string
          description: 服务名，固定 `BehindVeil-server`
          examples: [BehindVeil-server]
        protocol:
          type: string
          description: 前后端协议版本，Socket 握手时校验，不一致即拒绝连接
          examples: ['0.0.0']
      required: [ok, name, protocol]

    # ---- 错误 ----

    ErrorCode:
      type: string
      description: 业务错误码（TDD §11 + 2026-09-25 拍板新增 E-MOD-01 / E-SRV-01）
      enum:
        - E-LLM-01
        - E-LLM-02
        - E-DICE-01
        - E-AI-01
        - E-ST-01
        - E-ROOM-01
        - E-MOD-01
        - E-SRV-01
      x-code-scenes:
        E-LLM-01: provider 超时/5xx
        E-LLM-02: 流中断
        E-DICE-01: 骰式非法
        E-AI-01: AI 指令解析失败
        E-ST-01: 状态板版本冲突
        E-ROOM-01: 邀请码无效/满员、房间或会话不存在、请求体非法、管理面未授权
        E-MOD-01: 模组卸载冲突（被活跃会话引用）
        E-SRV-01: 服务端持久化/内部错误

    AppError:
      type: object
      description: 业务错误统一载荷（Socket `error:app` 与 REST 错误响应共用）
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 用户侧可直接展示的中文文案
      required: [code, message]
      examples:
        - code: E-ROOM-01
          message: 房间不存在

    InternalError:
      type: object
      description: 框架级错误（Fastify error handler 出口，已脱敏）
      properties:
        code:
          type: string
          const: INTERNAL
        message:
          type: string
      required: [code, message]

    # ---- Room / Session / Member ----

    Room:
      type: object
      description: |
        房间公开对象（TDD §3.1 / shared/domain.ts RoomSchema）。
        **不含 hostToken**——它是服务端机密，只在建房响应里出现一次。
      properties:
        id:
          type: string
          description: nanoid(12)，建房时生成
          examples: [V1StGXR8_Z5j]
        name:
          type: string
          examples: [疯狂山脉·第一夜]
        createdAt:
          type: string
          format: date-time
          description: ISO8601
        inviteCode:
          type: string
          minLength: 6
          maxLength: 6
          description: 6 位邀请码，可经 invite-reset 重置
          examples: [A7K2Q9]
        activeSessionId:
          type: [string, 'null']
          description: 当前活跃会话 ID；未开团或已结束时为 null
        memberLimit:
          type: integer
          minimum: 1
          description: 成员上限（默认 8，建房时可设 2–64）
          default: 8
        hostAuth:
          type: string
          enum: [token, member]
          description: |
            Host 身份锚定方式（T-M8-06）：token=建房者凭 hostToken（v1 缺省）；
            member=转让后凭成员角色标记 + memberId 重连（旧 token 已轮换失效）。
          examples: [token]
        coHostMemberId:
          type: [string, 'null']
          description: 副 Host 成员 ID（T-M8-06，一名；与 Host 同享快照/状态编辑权限）；无副 Host 为 null
        defaultSessionSettings:
          $ref: '#/components/schemas/SessionSettings'
      required: [id, name, createdAt, inviteCode, activeSessionId, memberLimit]

    RoomWithHostToken:
      description: |
        建房响应专用：房间对象 + 一次性 `hostToken`（决议 ①）。
        `hostToken` 只在本次响应出现，任何其他接口与广播都不回带。
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          properties:
            hostToken:
              type: string
              description: Host 身份凭证，进房时经 `room:join` 出示
              examples: [ht_9f2c1a7b3e5d]
          required: [hostToken]

    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        memberLimit:
          type: integer
          minimum: 2
          maximum: 64
          default: 8
        defaultSessionSettings:
          $ref: '#/components/schemas/SessionSettings'
      required: [name]

    RoomSettingsPatch:
      type: object
      description: 房间配置局部更新（未传字段保持不变）
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        memberLimit:
          type: integer
          minimum: 2
          maximum: 64
        defaultSessionSettings:
          $ref: '#/components/schemas/SessionSettings'

    InviteCode:
      type: object
      properties:
        inviteCode:
          type: string
          minLength: 6
          maxLength: 6
          examples: [9ZP4RT]
      required: [inviteCode]

    ActiveSessionRequest:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
          description: 目标会话 ID，必须属于该房间
          examples: [s_01J9Z8Y7X6]
      required: [sessionId]

    SessionSettings:
      type: object
      description: |
        会话级 LLM / 管线设置（TDD §3.1）。全字段必填——
        裁剪窗 / 预算 / 扫描深度缺失会让管线行为失义。
      properties:
        provider:
          type: string
          description: 'LLM provider：openai-compat | ollama'
          examples: [openai-compat]
        model:
          type: string
          examples: [deepseek-chat]
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.8
        nat20Rule:
          type: string
          enum: [attack_only, all_d20]
          description: |
            nat20 / nat1 的适用面（v2 FR-22，仅 5e 消费）。
            attack_only（默认）= 官方口径：仅攻击骰强制 nat20 必中、nat1 必失；
            all_d20 = 常见桌面房规：所有 d20 检定都适用。
            该开关随判定记录落审计流水，否则非默认房规的骰子无法复现。
          default: attack_only
        maxHistoryMessages:
          type: integer
          minimum: 1
          description: 历史裁剪窗（默认 40）
          default: 40
        worldBookBudgetTokens:
          type: integer
          minimum: 0
          description: 世界书 token 预算（默认 2000）
          default: 2000
        scanDepth:
          type: integer
          minimum: 1
          description: 世界书扫描深度（最近 N 条消息，默认 4）
          default: 4
        contextWindowTokens:
          type: integer
          minimum: 1
          description: |
            模型上下文窗口。S7 硬顶 = contextWindowTokens − outputReserveTokens，
            超顶回退 S5 再裁历史（TDD §5.1）。默认按 32K 级模型。
          default: 32768
        outputReserveTokens:
          type: integer
          minimum: 1
          description: 为模型输出预留的 token 数，参与 S7 硬顶计算
          default: 2048
      required:
        - provider
        - model
        - temperature
        - maxHistoryMessages
        - worldBookBudgetTokens
        - scanDepth
        - contextWindowTokens
        - outputReserveTokens

    SessionSettingsPatch:
      type: object
      description: |
        会话运行时设置局部更新（T-M6-04 支撑端点）。全字段可选，**至少一项**——
        空对象 → 400。未传字段保持会话原值。
      minProperties: 1
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        nat20Rule:
          type: string
          enum: [attack_only, all_d20]
          description: nat20 / nat1 适用面（v2 FR-22，5e 消费）
        maxHistoryMessages:
          type: integer
          minimum: 1
        worldBookBudgetTokens:
          type: integer
          minimum: 0
        scanDepth:
          type: integer
          minimum: 1
        contextWindowTokens:
          type: integer
          minimum: 1
        outputReserveTokens:
          type: integer
          minimum: 1

    Session:
      type: object
      description: 会话（TDD §3.1 / shared/domain.ts SessionSchema）
      properties:
        id:
          type: string
          examples: [s_01J9Z8Y7X6]
        roomId:
          type: string
        moduleRef:
          type: string
          description: 模组 id（+ version，§3.6）；当前由 session:start 的 moduleId 直接填入
          examples: [mountains-of-madness]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          description: 结束时间；活跃会话为 null
        rulebook:
          type: string
          enum: [coc7, dnd5e, generic]
          description: |
            本会话采用的规则书（v2 FR-20，一房一规则书）：开团时由模组决定
            （KP 卡 extensions.aidle.rulebook 优先，回退 manifest.rulebook），缺省 coc7。
            v1 存量数据无此字段，按 coc7 处理。generic 为 v3 第三实现（FR-40）。
          default: coc7
        genericRule:
          type: object
          description: |
            generic 规则书配置快照（v3 FR-40 / ADR-3-08）：开团时自 KP 卡冻结——
            会话自足（重启后无卡也能判定），KP 卡中途改配置不影响进行中的会话。
            仅 rulebook=generic 的会话携带；结构见 shared/dice.ts GenericRuleSchema。
        stateBoardVersion:
          type: integer
          minimum: 0
          description: 状态板乐观锁版本号（E-ST-01 冲突检测依据）
        settings:
          $ref: '#/components/schemas/SessionSettings'
        synopsis:
          type: string
          description: |
            剧情梗概（决议 D-01）：历史裁剪后被裁掉的部分以梗概块替代。
            v1 由 Host 手编 session.json 的该字段，载入时过 Schema 校验，无运行时编辑 UI。
          default: ''
      required: [id, roomId, moduleRef, startedAt, endedAt, stateBoardVersion, settings, synopsis]

    Member:
      type: object
      description: 房间成员（members.json，TDD §3.1 / shared/domain.ts MemberSchema）
      properties:
        id:
          type: string
          description: 成员 ID，断线重连时可用它复用身份
          examples: [m_alice]
        name:
          type: string
          description: 房内展示昵称
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          type: string
          format: date-time
      required: [id, name, role, joinedAt]

    MemberRole:
      type: string
      enum: [host, player, observer]
      description: 'host=建房者（凭 hostToken）· player=玩家 · observer=旁观（v1 不可发言）'

    # ---- Message（六类，TDD §3.2）----

    BaseMsg:
      type: object
      description: |
        消息公共字段。消息不可变（append-only），seq 在 Session 内严格单调递增；
        服务端重启后从恢复出的 lastSeq 续，绝不回退（NFR-06 / FR-11）。
      properties:
        seq:
          type: integer
          minimum: 0
          description: 会话内严格递增序号
        ts:
          type: string
          format: date-time
        sessionId:
          type: string
      required: [seq, ts, sessionId]

    IcMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type:
              type: string
              const: ic
            senderId:
              type: string
              description: 成员 ID
            content:
              type: string
              description: 入戏发言正文
          required: [type, senderId, content]

    OocMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type:
              type: string
              const: ooc
            senderId:
              type: string
            content:
              type: string
            visibility:
              type: string
              enum: [all, host, whisper]
              description: all=全员可见 / host=仅 Host / whisper=私聊（带 targetId）
            targetId:
              type: string
              description: visibility=whisper 时的私聊对象成员 ID
          required: [type, senderId, content, visibility]

    SystemMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type:
              type: string
              const: system
            subtype:
              type: string
              enum: [ai_directive_result, join, leave, notice]
              description: |
                ai_directive_result=检定闭环回注的引擎结果；
                join/leave=进出房系统播报；notice=如「会话已开始（模块 id）」
            content:
              type: string
          required: [type, subtype, content]

    DiceMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type:
              type: string
              const: dice
            roll:
              $ref: '#/components/schemas/RollResult'
            hidden:
              type: boolean
              description: |
                true = 暗骰（FR-14），结果仅广播给 Host（决议 D-10：仅 Host 可用）。
                **REST 历史接口会剔除暗骰**，Host 只能从实时流看到。
          required: [type, roll, hidden]

    NarrationMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type:
              type: string
              const: narration
            streaming:
              type: boolean
              description: false 后 content 即最终全文（narration:done 转正）
            content:
              type: string
          required: [type, streaming, content]

    SnapshotMsg:
      allOf:
        - $ref: '#/components/schemas/BaseMsg'
        - type: object
          properties:
            type:
              type: string
              const: state_snapshot
            stateBoard:
              $ref: '#/components/schemas/StateBoard'
          required: [type, stateBoard]

    Message:
      description: 六类消息的判别联合（非法 type 在 Schema 层直接拒绝）
      oneOf:
        - $ref: '#/components/schemas/IcMsg'
        - $ref: '#/components/schemas/OocMsg'
        - $ref: '#/components/schemas/SystemMsg'
        - $ref: '#/components/schemas/DiceMsg'
        - $ref: '#/components/schemas/NarrationMsg'
        - $ref: '#/components/schemas/SnapshotMsg'
      discriminator:
        propertyName: type
        mapping:
          ic: '#/components/schemas/IcMsg'
          ooc: '#/components/schemas/OocMsg'
          system: '#/components/schemas/SystemMsg'
          dice: '#/components/schemas/DiceMsg'
          narration: '#/components/schemas/NarrationMsg'
          state_snapshot: '#/components/schemas/SnapshotMsg'

    # ---- 骰子（TDD §3.5）----

    RollCheck:
      type: object
      description: 规则书判定记录（由 RuleBook.adjudicate 填充）
      properties:
        rulebook:
          type: string
          enum: [coc7, dnd5e, generic]
          description: 规则书（v1 首发仅 COC7，dnd5e 二期，generic 三期 FR-40）
        kind:
          type: string
          enum: [skill, sanity, opposed, luck, ability, save, attack, initiative, check]
          description: 判定种类；check 为 generic 缺省种类（v3 FR-40）
        target:
          type: number
          description: 判定目标值（技能值 / SAN 值 / 幸运值，或骰式后缀里的 target）
        difficulty:
          type: string
          enum: [normal, hard, extreme]
        outcome:
          type: string
          enum: [critical, success, fail, fumble]
          description: COC7 语义：大成功 / 成功 / 失败 / 大失败
        grade:
          type: string
          enum: [normal, hard, extreme]
          description: |
            成功子等级。COC7 困难/极难成功时携带；critical / fail / fumble 恒为 normal。
            outcome 四分类不足以表达 COC7 六档判定表，故用 outcome + grade 组合承载。
        op:
          type: string
          enum: ['<=', '>=', '=']
          description: |
            判定后缀运算符（2026-09-25 拍板方案 a，T-M4-02 落地）。缺省即 `<=`
            （走规则书判定表）；`>=` / `=` 走通用布尔比较，outcome 仅 success/fail 且不带 grade。
        nat20Rule:
          type: string
          enum: [attack_only, all_d20]
          description: 判定时的 nat20 适用面快照（5e；同一骰值在不同开关下结果不同，复现凭据）
        genericGrades:
          type: array
          description: 判定时的 generic 档表快照（v3 FR-40；仅 generic 且配置了 grades 时携带，复现凭据）
          items:
            type: object
            properties:
              name:
                type: string
                enum: [critical, success, fail, fumble]
              when:
                type: string
                description: 受限文法（只比 raw/total），如 "total>=10"
      required: [rulebook, kind, target, difficulty, outcome]
      examples:
        - rulebook: coc7
          kind: skill
          target: 60
          difficulty: normal
          outcome: success
          grade: hard

    RollAudit:
      type: object
      description: |
        审计字段（决议 D-04）。CSPRNG 无种子、不可重放，
        「复现」= 由 expr + rolls 重算 total / kept / check 的一致性。
      properties:
        seq:
          type: string
          description: 审计流水号，全局唯一（data/logs/audit-dice.jsonl）
          examples: ['000913']
        ts:
          type: string
          format: date-time
        rollId:
          type: string
          description: 本次掷骰标识
          examples: [01J9ZB3Q7R]
      required: [seq, ts, rollId]

    RollResult:
      type: object
      description: |
        掷骰结果。数值只由服务端 CSPRNG 产生（crypto.randomInt）；
        rolls 保存每组原始骰值，total / kept / check 均可由 expr + rolls 重算复现。
      properties:
        expr:
          type: string
          description: 规范化表达式
          examples: ['1d100', '3d6kh2', '2d6+3<=8']
        rolls:
          type: array
          description: 每个骰组的原始骰值（命运骰取值 -1/0/1），审计重算的输入之一
          items:
            type: array
            items:
              type: number
          examples: [[[37]], [[4, 2, 6]]]
        kept:
          type: array
          description: 保留值（应用 kh/kl/dh/dl 后，按骰组顺序平铺）
          items:
            type: number
          examples: [[37]]
        total:
          type: number
          examples: [37]
        check:
          $ref: '#/components/schemas/RollCheck'
        audit:
          $ref: '#/components/schemas/RollAudit'
      required: [expr, rolls, kept, total, audit]
      examples:
        - expr: 3d6kh2
          rolls: [[4, 2, 6]]
          kept: [6, 4]
          total: 10
          audit:
            seq: '000914'
            ts: '2026-09-25T10:33:10.000Z'
            rollId: 01J9ZB7T4K

    # ---- 角色卡 / 状态板 / 世界书 ----

    PCSheet:
      description: |
        角色卡判别联合（T-M8-01，FR-24 / 设计文档 v2 §5.3）：按 `rulebook` 分流两套字段体系。
        **旧数据零迁移**：缺 `rulebook` 字段的存量卡/存档按 coc7 解析（zod default）。
        5e 卡只存原始数值——修正值由服务端现算（名册取值器），AI 与客户端都不传数值。
      oneOf:
        - type: object
          description: COC7 调查员卡（v1 字段原样 + 判别字段）
          properties:
            rulebook:
              type: string
              enum: [coc7]
              default: coc7
              description: 判别字段；旧数据无此字段时按 coc7 补
            playerName:
              type: string
            occupation:
              type: string
              description: 职业
            str:
              type: number
            con:
              type: number
            siz:
              type: number
            dex:
              type: number
            app:
              type: number
            int:
              type: number
            pow:
              type: number
            edu:
              type: number
            luck:
              type: number
            hp:
              type: number
            mp:
              type: number
            san:
              type: number
            db:
              type: string
              description: 伤害加值
              examples: ['0']
            build:
              type: string
              description: 体格
              examples: ['0']
            skills:
              type: object
              additionalProperties:
                type: number
              description: 技能名 → 技能值
              examples:
                - 侦查: 60
                  图书馆使用: 50
          required:
            - playerName
            - occupation
            - str
            - con
            - siz
            - dex
            - app
            - int
            - pow
            - edu
            - luck
            - hp
            - mp
            - san
            - db
            - build
            - skills
          examples:
            - rulebook: coc7
              playerName: 爱丽丝
              occupation: 考古学家
              str: 50
              con: 60
              siz: 55
              dex: 70
              app: 65
              int: 80
              pow: 60
              edu: 85
              luck: 50
              hp: 11
              mp: 12
              san: 60
              db: '0'
              build: '0'
              skills:
                侦查: 60
                图书馆使用: 50
        - type: object
          description: D&D 5e 角色卡（T-M8-01）
          properties:
            rulebook:
              type: string
              enum: [dnd5e]
            playerName:
              type: string
            occupation:
              type: string
              description: 职业与种族（展示与名册用）；缺省空串
            abilities:
              type: object
              description: 六维属性值（非调整值——调整值服务端现算）
              properties:
                str: { type: number }
                dex: { type: number }
                con: { type: number }
                int: { type: number }
                wis: { type: number }
                cha: { type: number }
              required: [str, dex, con, int, wis, cha]
            proficiencyBonus:
              type: number
              description: 熟练加值（随等级走，卡里写死，服务端不推导等级）
            ac:
              type: number
              description: 护甲等级
            hp:
              type: object
              properties:
                max: { type: number }
                current: { type: number }
              required: [max, current]
            proficientSkills:
              type: array
              items: { type: string }
              description: 熟练技能名（缺省空数组；取值时按名匹配属性）
            proficientSaves:
              type: array
              items:
                type: string
                enum: [str, dex, con, int, wis, cha]
              description: 熟练豁免（缺省空数组）
          required:
            - rulebook
            - playerName
            - abilities
            - proficiencyBonus
            - ac
            - hp
          examples:
            - rulebook: dnd5e
              playerName: 艾恩
              occupation: 游荡者
              abilities: { str: 10, dex: 16, con: 12, int: 13, wis: 16, cha: 8 }
              proficiencyBonus: 2
              ac: 15
              hp: { max: 22, current: 22 }
              proficientSkills: [察觉]
              proficientSaves: [dex, int]

    StateBoardPc:
      type: object
      properties:
        sheet:
          $ref: '#/components/schemas/PCSheet'
        conditions:
          type: array
          description: 状态标记
          items:
            type: string
          examples: [['疯狂(临时)', '重伤']]
      required: [sheet, conditions]

    StateBoardScene:
      type: object
      properties:
        name:
          type: string
        time:
          type: string
        publicDesc:
          type: string
          description: 场景公开描述（全员可见）
      required: [name, time, publicDesc]

    StateBoard:
      type: object
      description: |
        PC 数值权威状态（TDD §3.7）。任何数值以状态板为准；
        AI 叙事与状态板冲突时以状态板为准（S1 元指令 + S2 注入）。
      properties:
        version:
          type: integer
          minimum: 0
          description: 乐观锁版本（写路径校验 expectedVersion，冲突报 E-ST-01）
        pcs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StateBoardPc'
          description: key = memberId
        scene:
          $ref: '#/components/schemas/StateBoardScene'
        facts:
          type: array
          description: 已确立事实（Host 可维护，注入 prompt）
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
      required: [version, pcs, scene, facts, updatedAt]

    WorldBookEntry:
      type: object
      description: '世界书条目（字段语义与 SillyTavern 对齐，TDD §3.4；手编指南见 docs/worldbook.md）'
      properties:
        uid:
          type: integer
        key:
          type: array
          description: 主关键词，支持 /regex/ 形式
          items:
            type: string
          examples: [['南极', '/冰层.*异常/']]
        keysecondary:
          type: array
          items:
            type: string
        selectiveLogic:
          type: integer
          enum: [0, 1, 2, 3]
          description: 二级键逻辑 0=AND_ANY 1=NOT_ALL 2=NOT_ANY 3=AND_ALL
        content:
          type: string
          description: 命中后注入 prompt 的正文
        position:
          type: string
          enum: [before_char, after_char, at_depth]
        depth:
          type: integer
          minimum: 0
          description: position=at_depth 时生效
        order:
          type: integer
          description: 同优先级排序
        weight:
          type: integer
          description: 默认 100；预算不足时高权重保留（裁剪依据）
          default: 100
        constant:
          type: boolean
          description: true = 常驻注入
        disabled:
          type: boolean
        extensions:
          type: object
          properties:
            kpOnly:
              type: boolean
              description: |
                模组真相条目：注入 prompt 让 AI 知道，
                但不得出现在非 Host 可见输出（TDD §8）
      required:
        - uid
        - key
        - keysecondary
        - selectiveLogic
        - content
        - position
        - order
        - weight
        - constant
        - disabled

    WorldBook:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorldBookEntry'
      required: [entries]

    AidleCardExtensions:
      type: object
      description: BehindVeil 私有扩展（ADR-06），挂在 ccv3 的 data.extensions.aidle 下
      properties:
        rulebook:
          type: string
          enum: [coc7, dnd5e, generic]
        genericRule:
          type: object
          description: generic 规则书配置（v3 FR-40 / ADR-3-08），仅 rulebook=generic 时携带
        pcSheet:
          $ref: '#/components/schemas/PCSheet'
      required: [rulebook]

    CharacterCardV3:
      type: object
      description: chara_card_v3 角色卡（KP 卡 / 玩家卡同构，靠 extensions.aidle 区分）
      properties:
        spec:
          type: string
          const: chara_card_v3
        data:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
              description: KP 卡：行为准则 + 判定规则
            scenario:
              type: string
            first_mes:
              type: string
            mes_example:
              type: string
            character_book:
              $ref: '#/components/schemas/WorldBook'
            extensions:
              type: object
              description: ccv3 允许任意扩展键，社区卡字段原样保留
              properties:
                aidle:
                  $ref: '#/components/schemas/AidleCardExtensions'
          required: [name, description, scenario, first_mes, mes_example, extensions]
      required: [spec, data]

    CardSummary:
      type: object
      description: 卡库列表用摘要（不返回角色卡全文，character_book 可能很大）
      properties:
        id:
          type: string
          examples: [c_kp_mountain]
        name:
          type: string
        spec:
          type: string
          const: chara_card_v3
        rulebook:
          type: string
          enum: [coc7, dnd5e, generic]
          nullable: true
          description: |
            卡内 `extensions.aidle.rulebook`。社区卡常不带该扩展 → **null**（实现不编造规则书，
            由 UI 提示用户补；猜错规则书会让判定口径跟着错）。
        kind:
          type: string
          enum: [kp, pc]
          description: KP 人格卡 / 玩家角色卡（带 pcSheet 即 pc）
        source:
          type: string
          enum: [json, png]
          description: 来源格式（FR-08 双格式），按真实字节判定而非扩展名
        updatedAt:
          type: string
          format: date-time
      required: [id, name, spec, rulebook, kind, source, updatedAt]

    UploadCardRequest:
      type: object
      description: |
        上传走 base64 JSON 而非 multipart（2026-09-26 实现时定的偏差）：
        省一个 multipart 依赖，PNG 与 JSON 共用同一入口。
      properties:
        fileName:
          type: string
          description: 原始文件名（只保留安全字符、剥离路径分隔符；同名自动追加 `_2`）
          examples: [keeper.png]
        contentBase64:
          type: string
          description: 卡片文件内容的 base64（.json 原文，或内嵌 ccv3/chara 块的 .png）
      required: [fileName, contentBase64]

    RoomPublic:
      type: object
      description: 玩家侧房间信息（不含邀请码/hostToken，2026-09-25 路由分离新增）
      properties:
        id:
          type: string
        name:
          type: string
        memberLimit:
          type: integer
        activeSessionId:
          type: string
          nullable: true
      required: [id, name, memberLimit, activeSessionId]

    ModuleInfo:
      type: object
      description: 模组包信息（TDD §3.6）
      properties:
        id:
          type: string
          examples: [mountains-of-madness]
        name:
          type: string
        version:
          type: string
          examples: [1.0.0]
        rulebook:
          type: string
          enum: [coc7, dnd5e, generic]
        apiVersion:
          type: string
          description: 模组格式版本，与服务端不匹配即拒绝加载
          examples: ['1']
        activeSessions:
          type: integer
          minimum: 0
          description: 引用该模组的活跃会话数（> 0 时拒绝卸载，D-09）
      required: [id, name, version, rulebook, apiVersion, activeSessions]

    PcDeclaration:
      type: object
      description: 房间级 PC 声明（T-M5-04，key = memberId，开团时装配进状态板初始 pcs）
      properties:
        memberId:
          type: string
        sheet:
          $ref: '#/components/schemas/PCSheet'
        source:
          type: string
          enum: [card, manual]
          description: card=卡库玩家卡 pcSheet 装配；manual=速建表直填
        cardId:
          type: string
          description: source=card 时的卡库文件名
      required: [memberId, sheet, source]
