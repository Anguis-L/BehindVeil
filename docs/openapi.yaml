openapi: 3.1.0

# =============================================================================
# BehindVeil · 管理面 REST API 契约（OpenAPI 3.1）
#
# 单一事实来源（本文件随代码回写，勿凭空改）：
#   - packages/server/src/gateway/http/rooms.ts   路由实现与 Zod 校验
#   - packages/shared/src/{domain,message,dice,errors}.ts   Schema 与错误码
#   - packages/server/src/config.ts                AIDLE_ADMIN_TOKEN 门禁
#   - 00.development/AI_KP_TDD_技术设计文档_v1.md §3/§4/§8/§11
#   - 00.development/AI_KP_施工文档_v1.md 决议 D-02/D-03/D-09/D-10
#
# 状态标注（x-status）：
#   implemented = 代码已实现（M1 管理面已落地）
#   proposed    = 设计文档只说"走 REST"、路径与字段为提案，代码未开工（M5 卡库/模组）
#
# 房内实时交互（消息、掷骰、AI 叙事、状态板）不走 REST，走 Socket.IO，
# 见同目录 socketio-asyncapi.yaml。
#
# 最近一次回写：2026-09-25（M1 管理面落地 + 四项开放问题拍板）
# =============================================================================

info:
  title: BehindVeil 管理面 API
  version: 0.0.0
  summary: 自托管 TRPG 平台的房间/会话/历史消息管理接口
  description: |
    BehindVeil 是一个自托管的多人在线文字跑团平台：AI 扮演守秘人（KP）负责叙事，
    **服务端用 CSPRNG 掷骰并按规则书判定**——叙事交给 LLM，规则交给代码。

    本文件只描述**管理面 HTTP REST**：建房、房间列表、邀请码重置、房间配置、
    会话查询与切换、历史消息拉取。房内实时交互走 Socket.IO，见 `socketio-asyncapi.yaml`。

    ## 实现状态

    M1 已落地，**房间 / 会话 / 历史消息这一组接口全部可用**（标注 implemented）。
    卡库（`/cards`）与模组（`/modules`）属 M5，仍是提案（proposed）。

    ## 鉴权：X-Admin-Token（可选门禁）

    服务端启动时读环境变量 `AIDLE_ADMIN_TOKEN`：

    - **未设置**（默认，零配置）：管理接口全部放行，靠网络边界保护
      （只监听 127.0.0.1，或反代 + TLS + IP 白名单）。
    - **已设置**：除 `/healthz` 外的**全部**管理接口必须带 `X-Admin-Token` 头，
      缺失或不一致 → `401`，载荷 `{ code: 'E-ROOM-01', message: '管理面需要 X-Admin-Token 令牌' }`。

    ⚠️ **浏览器前端不会带这个头**（`packages/web` 只调 `GET /rooms/{id}` 与
    `GET /rooms/{id}/messages`）。所以一旦设置该令牌，网页端这两个只读请求会被 401 挡掉。
    它是给运维脚本 / curl 用的开关，不是给浏览器用的登录态。

    ## 错误模型

    业务错误统一 `AppError` 载荷（错误码表见 TDD §11 + 2026-09-25 拍板新增两码）：

    | 错误码 | 场景 | 用户侧提示 |
    |---|---|---|
    | E-LLM-01 | provider 超时/5xx | KP 沉吟中…（重试） |
    | E-LLM-02 | 流中断 | 生成中断，已保留已生成部分 |
    | E-DICE-01 | 骰式非法 | 骰式无法解析 |
    | E-AI-01 | AI 指令解析失败 | （玩家无感，KP 端告警） |
    | E-ST-01 | 状态板版本冲突 | 数据已更新，请刷新 |
    | E-ROOM-01 | 邀请码无效/满员、房间或会话不存在、请求体非法、管理面未授权 | 见各接口 |
    | E-MOD-01 | 模组卸载冲突（D-09） | 模组使用中，无法卸载 |
    | E-SRV-01 | 服务端持久化/内部错误 | 服务器开小差了，请稍后重试 |

    请求体非法（400）的 `message` 取 Zod 首个 issue，格式 `字段路径: 原因`，
    例如 `name: 字数不得少于 1`。
    框架级未捕获异常走 `INTERNAL`（HTTP ≥ 500 不回传原始 message，防 key 泄露，NFR-03）。

    ## 2026-09-25 已拍板的四项决策（原开放问题，已落地）

    1. **Host 身份**：建房响应**一次性**下发 `hostToken`；进房时 `room:join` 携带它即被认定为 Host。
       `hostToken` 是服务端机密（`room.json` 内存），**除建房响应外任何响应与广播都不回带**
       （`toPublicRoom` 强制剥离）。Host 重连同样必须出示，防凭 `memberId` 冒领。
    2. **管理面鉴权**：`AIDLE_ADMIN_TOKEN` + `X-Admin-Token` 头，不设置则不启用（见上）。
    3. **模组卸载冲突**：新增错误码 `E-MOD-01`（"模组使用中，无法卸载"）。
    4. **历史消息通道**：走 REST（`GET /rooms/{roomId}/messages`）；
       Socket 只补断线期间的缺口（`room:join` 的 `lastSeq`）。
  contact:
    name: BehindVeil
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:8787
    description: '本地默认（config.yaml：host=127.0.0.1、port=8787）'
  - url: http://{host}:{port}
    description: 自建部署（公网部署务必配合反向代理 + TLS）
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '8787'

tags:
  - name: 系统
    description: 健康检查与存活探测
  - name: 房间
    description: 建房 / 列表 / 详情 / 邀请码 / 配置（T-M1-02，决议 D-03）
    x-milestone: M1
  - name: 会话
    description: 一房多会话（连载团）查询、结束与切换（T-M1-07，FR-11）
    x-milestone: M1
  - name: 历史消息
    description: 进房拉历史与向前翻页（T-M1-09，决议 ④）
    x-milestone: M1
  - name: 卡库
    description: chara_card_v3 角色卡导入导出（T-M5-09，FR-08）
    x-milestone: M5
  - name: 模组
    description: 模组包加载 / 卸载（T-M5-05，FR-10，决议 D-09）
    x-milestone: M5
  - name: 可观测
    description: 进程内指标（T-M6-03，FR-13 / R-01 / R-02，TDD §9）
    x-milestone: M6

x-extension-vocabulary:
  x-status: implemented | proposed
  x-milestone: '对应里程碑 M0–M6'
  x-source: 代码路径或设计文档任务卡 ID

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [系统]
      summary: 健康检查
      description: |
        返回服务存活状态、服务名与协议版本。
        不依赖存储恢复与 LLM 配置，仅表示 HTTP 层可响应。
        **唯一不参与管理面门禁的接口**。
      x-status: implemented
      x-milestone: M0
      x-source: packages/server/src/index.ts
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  summary: 正常响应
                  value:
                    ok: true
                    name: BehindVeil-server
                    protocol: 0.0.0

  /metrics:
    get:
      operationId: getMetrics
      tags: [可观测]
      summary: 进程内全局指标
      description: |
        FR-13 / R-01 / R-02，TDD §9「指标」一行的落地：返回**进程内累计**的四类指标
        ——运行秒数、指令解析成功率、骰子总数、LLM 调用（次数 / 失败 / 输入输出 token /
        延迟分布 p50·p95·max·avg）。

        几点口径要说明：

        - **全局口径，不区分房间**；要看单个会话的实时数（含成本估算）走
          Socket 事件 `kp:metrics`（见 `socketio-asyncapi.yaml`）——前端不带管理令牌，
          拿不到本端点。
        - 指令成功率的分母口径同测试文档 §12.4：成功 + 解析失败 + 白名单拒绝，
          **截断块不计**；一次尝试都没有时 `rate = 1`（尚无失败证据，不误报）。
        - 全部来自内存，**不读盘**（指标旁路不能拖慢跑团主链路）；进程重启即清零。
        - 延迟分布只取最近 200 次调用（长团内存不随轮次增长），累计计数不受影响。
      x-status: implemented
      x-milestone: M6
      x-source: 'packages/server/src/gateway/http/metrics.ts（T-M6-03）'
      security:
        - adminToken: []
      responses:
        '200':
          description: 全局指标快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
              examples:
                running:
                  value:
                    uptimeSec: 7345
                    directives: { attempts: 128, successes: 124, rate: 0.96875 }
                    dice: { total: 96, hidden: 12 }
                    llm:
                      calls: 132
                      failures: 1
                      tokensIn: 792000
                      tokensOut: 128000
                      latencyMs: { p50: 1180, p95: 3420, max: 9100, avg: 1462.5 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /search:
    get:
      operationId: searchMessages
      tags: [可观测]
      summary: 跨房间消息检索
      description: |
        v3 FR-34：在**全部房间**的已落盘消息里做关键词子串检索，用于 KP 事后
        「那句话发生在哪个团」。

        几点口径要说明：

        - 数据来自 `data/index/global.jsonl`——消息落盘时同批追加的派生索引，
          损坏或缺失时用 `pnpm aidle-reindex` 全量重建；索引永不回写消息本体。
        - **结果含暗骰行**（`hidden: true`）。索引是管理面 Host 视角完整版：
          隐藏的是广播范围，不是凭据（与骰子审计流水同一哲学）。
          玩家侧要翻历史请走 `GET /rooms/{roomId}/messages`（按身份过滤暗骰/密语），
          两套可见性口径不混用。
        - 命中按 seq 降序，默认 50 条（上限 200）；要翻全文走上面那个消息端点。
        - 只读端点，永不写索引。
      x-status: implemented
      x-milestone: M11
      x-source: 'packages/server/src/gateway/http/search.ts（T-M11-05）'
      security:
        - adminToken: []
      parameters:
        - name: q
          in: query
          required: true
          description: 关键词（子串匹配，大小写敏感）
          schema:
            type: string
          example: 灯塔
        - name: roomId
          in: query
          required: false
          description: 限定单个房间；缺省全房间
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 单页条数，上限 200
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 命中行（seq 降序）
          content:
            application/json:
              schema:
                type: object
                required: [query, hits]
                properties:
                  query:
                    type: string
                  hits:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalIndexEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /rooms/{roomId}/worldbook:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoomWorldBook
      tags: [世界书]
      summary: 读取房间世界书
      description: |
        v3 FR-35：世界书编辑器（KP 控制台「世界书」标签）的读取端。
        文件不存在时返回空条目数组（世界书是可选的）。

        落盘形态自 M11 起为 `{ schemaVersion, entries }`（收编进迁移管辖，
        与 room/members 同一口径）；**手编的裸 `{entries}` 照样读得进**，
        不强制先跑 `pnpm aidle-migrate`。
      x-status: implemented
      x-milestone: M11
      x-source: 'packages/server/src/gateway/http/worldbook.ts（T-M11-06）'
      security:
        - adminToken: []
      responses:
        '200':
          description: 房间世界书条目 + 语义告警
          content:
            application/json:
              schema:
                type: object
                required: [entries, warnings]
                properties:
                  entries:
                    $ref: '#/components/schemas/WorldBook'
                  warnings:
                    type: array
                    description: 语义隐患（不阻断，如「非常驻条目 key 为空，永远不会命中」）
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: putRoomWorldBook
      tags: [世界书]
      summary: 全量保存房间世界书
      description: |
        v3 FR-35：编辑器的唯一写入口——**全量替换**（不是增量 patch）。
        保存前一律过 `validateWorldBook`（决议 D-08 不变）：

        - 结构错误（uid 重复 / `position=at_depth` 缺 depth / Schema 不符）→ **400 拒绝落盘**，
          原文件分毫不动——宁可拒绝保存，也不把坏世界书留给下次开团；
        - 语义隐患（空关键词、非法正则）→ 200 保存成功，响应带回 `warnings`。

        写盘走原子写（tmp + fsync + rename），崩在任意点旧文件完好。
        模组层世界书不在此列（只读，见 `/modules/{moduleId}/worldbook`）。
      x-status: implemented
      x-milestone: M11
      x-source: 'packages/server/src/gateway/http/worldbook.ts（T-M11-06）'
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldBook'
      responses:
        '200':
          description: 保存成功（含语义告警）
          content:
            application/json:
              schema:
                type: object
                required: [entries, warnings]
                properties:
                  entries:
                    $ref: '#/components/schemas/WorldBook'
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: 结构校验未通过（未落盘）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /modules/{moduleId}/worldbook:
    parameters:
      - name: moduleId
        in: path
        required: true
        description: 模组 ID（manifest.id）
        schema:
          type: string
        example: mountains-of-madness
    get:
      operationId: getModuleWorldBook
      tags: [世界书]
      summary: 读取模组世界书（只读）
      description: |
        v3 FR-35：模组包是外部资产，**不提供写接口**。要改就在编辑器里
        「复制到房间层」再编辑——复制会把 uid 重排（模组 uid 与房间 uid 会撞），
        落点仍是 `PUT /rooms/{roomId}/worldbook`。

        模组未装载/校验不通过时 404（E-MOD-01）。
      x-status: implemented
      x-milestone: M11
      x-source: 'packages/server/src/gateway/http/worldbook.ts（T-M11-06）'
      security:
        - adminToken: []
      responses:
        '200':
          description: 模组世界书条目（只读）
          content:
            application/json:
              schema:
                type: object
                required: [entries, warnings]
                properties:
                  entries:
                    $ref: '#/components/schemas/WorldBook'
                  warnings:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 模组不存在或无法装载（E-MOD-01）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rooms:
    post:
      operationId: createRoom
      tags: [房间]
      summary: 创建房间（建房者即 Host）
      description: |
        创建房间，返回房间对象 **外加一次性 `hostToken`**。

        这是**唯一**会回带 `hostToken` 的接口（决议 ①）——建房者凭它在 `room:join` 时
        被认定为 Host。请妥善保存：后续任何接口都不再返回它，丢了只能重建房间
        （v1 Host 不可转让，决议 D-02）。
      x-status: implemented
      x-milestone: M1
      x-source: packages/server/src/gateway/http/rooms.ts
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            examples:
              minimal:
                summary: 最小建房
                value:
                  name: 疯狂山脉·第一夜
              full:
                summary: 指定人数上限与默认会话设置
                value:
                  name: 疯狂山脉·第一夜
                  memberLimit: 6
                  defaultSessionSettings:
                    provider: openai-compat
                    model: deepseek-chat
                    temperature: 0.8
                    maxHistoryMessages: 40
                    worldBookBudgetTokens: 2000
                    scanDepth: 4
                    contextWindowTokens: 32768
                    outputReserveTokens: 2048
      responses:
        '201':
          description: 创建成功（含一次性 hostToken）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomWithHostToken'
              examples:
                created:
                  value:
                    id: V1StGXR8_Z5j
                    name: 疯狂山脉·第一夜
                    createdAt: '2026-09-25T10:15:30.000Z'
                    inviteCode: A7K2Q9
                    activeSessionId: null
                    memberLimit: 6
                    hostToken: ht_9f2c1a7b3e5d
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

    get:
      operationId: listRooms
      tags: [房间]
      summary: 房间列表
      description: |
        列出本机 `data/rooms/` 下全部房间（自托管单机，无分页与租户隔离）。
        返回的是**剥离 hostToken 后的公开房间对象**；损坏或校验失败的房间文件跳过不列。
      x-status: implemented
      x-milestone: M1
      x-source: packages/server/src/gateway/http/rooms.ts
      security:
        - adminToken: []
      responses:
        '200':
          description: 房间数组（无房间时为空数组）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
              examples:
                two:
                  value:
                    - id: V1StGXR8_Z5j
                      name: 疯狂山脉·第一夜
                      createdAt: '2026-09-25T10:15:30.000Z'
                      inviteCode: A7K2Q9
                      activeSessionId: s_01J9Z8Y7X6
                      memberLimit: 6
                    - id: mK3pQr7tL2wX
                      name: 黑夜之子·第二章
                      createdAt: '2026-09-24T20:00:00.000Z'
                      inviteCode: 4BQXZT
                      activeSessionId: null
                      memberLimit: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoom
      tags: [房间]
      summary: 查询单个房间
      description: |
        房间不存在或 room.json 校验失败 → 404。
        响应含邀请码，**属管理端点**（需 X-Admin-Token）。
        前端要只读房间信息请改用 `/rooms/{roomId}/public`——它不给邀请码。
      x-status: implemented
      x-milestone: M1
      x-source: packages/server/src/gateway/http/rooms.ts
      security:
        - adminToken: []
      responses:
        '200':
          description: 房间详情（不含 hostToken）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              examples:
                one:
                  value:
                    id: V1StGXR8_Z5j
                    name: 疯狂山脉·第一夜
                    createdAt: '2026-09-25T10:15:30.000Z'
                    inviteCode: A7K2Q9
                    activeSessionId: s_01J9Z8Y7X6
                    memberLimit: 6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /rooms/{roomId}/public:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoomPublic
      tags: [房间]
      summary: 玩家侧房间信息（免令牌）
      description: |
        2026-09-25 路由分离新增：只给 `id / name / memberLimit / activeSessionId`，
